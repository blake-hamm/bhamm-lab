name: tofu-cicd
on:
  workflow_dispatch:
    inputs:
      stacks:
        description: space-separated stack dirs from KNOWN_STACKS (e.g. proxmox/garage backblaze), or auto
        required: false
        # type is REQUIRED by Forgejo's dispatch form: the widget is picked
        # by input type; an empty type renders Invalid input type "" with no
        # field (GitHub defaults to string silently; Forgejo does not).
        type: string
        default: auto
  # push: fires on EVERY branch push -- no `paths` filter, and this is a
  # necessity, not an oversight. Forgejo's branch protection treats a
  # required glob that matches ZERO statuses on a SHA as PENDING
  # ("some required checks are missing"), which blocks automerge and
  # non-admin merges forever. If the workflow skipped tofu-clean pushes,
  # the required pattern cicd/tofu:** would never be satisfiable on those
  # SHAs. So exactly ONE cheap context must land on every SHA: a
  # tofu-clean push posts only `${STATUS_PREFIX}:no-changes` (success)
  # from the detect job. The HEAVY pipeline (fmt/lint/plan/apply) stays
  # internally gated: detect compares main...head via the Codeberg
  # compare API and every downstream job is conditional on the touched-
  # stack outputs, so a tofu-clean push costs one small detect job + one
  # status post -- seconds, not minutes. On a tofu-touching push the run
  # claims PENDING for every context it will finalize (one per touched
  # plan-enabled stack) BEFORE any gate work starts, so a run killed
  # mid-pipeline leaves PENDING contexts, never a stale green. Stacks
  # this change did not touch post NOTHING -- a quiet UI, no green noise.
  # ONE blind spot remains: the Codeberg->Forgejo mirror syncs a NEW
  # branch as a push with before=0000, and the compare in detect needs
  # the real base -- tofu changes in parent commits would vanish if the
  # tip commit were all that was considered (a silent skip was observed
  # and proved this). Branch creation is therefore owned by the `create`
  # trigger below; detect no-ops push events with before=0000 so the two
  # never double-run. ** spans / separators; * does not (validate.yml note).
  push:
    branches:
      - "**"
  # Fires exactly once per new ref synced by the mirror (~40s after the
  # branch appears on Forgejo; both branches and tags -- detect filters
  # ref_type). Payload carries ref_type + branch-tip sha but NO file diff
  # (paths filters are accepted but ignored on create; verified on this
  # instance), so detect diffs main...tip itself and therefore catches
  # tofu changes in ANY commit of the new branch, not just the tip.
  create:
env:
  # fallback pin only; the pin of record is tofu/.terraform-version
  OPENTOFU_VERSION: v1.13.2
  TFLINT_VERSION: v0.65.0
  TRIVY_VERSION: v0.76.1
  KNOWN_STACKS: "backblaze cloudflare gcp kubernetes proxmox/garage proxmox/talos"
  # ENABLED_STACKS are planned; only APPLY_STACKS may be applied on PR push
  # (PR-as-deployment). Every ENABLED stack is now apply-eligible:
  # proxmox/talos graduated once its CI plans proved stable (VMs carry
  # prevent_destroy); gcp graduated after its first plans proved clean.
  ENABLED_STACKS: "proxmox/garage backblaze cloudflare proxmox/talos gcp"
  APPLY_STACKS: "proxmox/garage backblaze cloudflare proxmox/talos gcp"
  # single source of truth for the commit-status context prefix: contexts
  # are <prefix>:<stack-id-with-slashes-as-dashes>, posted only for stacks
  # the change actually touched, plus exactly one <prefix>:no-changes on
  # tofu-clean pushes (the always-post context that keeps the required
  # glob satisfiable on every SHA). Branch protection required-check
  # pattern: cicd/tofu:** (glob).
  STATUS_PREFIX: "cicd/tofu"
jobs:
  detect:
    # decides which stacks this push/dispatch gates; emits plain space-
    # separated stack-dir lists (fmt/lint set + plan-enabled subset) plus
    # a no_changes flag: compare succeeded and NOTHING under tofu/ changed.
    # On a tofu-clean push the ci job (fmt/lint/plan/apply) is skipped
    # entirely and detect itself posts the single ${STATUS_PREFIX}:no-changes
    # status that keeps the required glob satisfiable on every SHA.
    # deliberately NOT a matrix: Forgejo 12.0.1 act collapses fromJson-built
    # matrices into ONE leg with an empty matrix (false green, run 170) and
    # leaves matrix.* unset in step-level if:. String outputs + shell loops
    # are the pattern proven on this runner (probe run 183).
    # no checkout needed; the compare API answers changed files
    runs-on: docker
    container: docker.io/alpine:3.20
    timeout-minutes: 5
    outputs:
      stacks: ${{ steps.pick.outputs.stacks }}
      plan: ${{ steps.pick.outputs.plan }}
      no_changes: ${{ steps.pick.outputs.no_changes }}
    steps:
      - name: apk deps
        run: apk add --no-cache curl jq bash
      - name: Pick stacks
        id: pick
        shell: bash
        env:
          INPUT_STACKS: ${{ github.event.inputs.stacks }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
          REFTYPE: ${{ github.event.ref_type }}
        run: |
          set -eu pipefail
          stacks=""
          plan=""
          note=""
          shared=false
          no_changes=false
          pick() {  # pick <dir>; appends to fmt/lint set, +plan set if enabled
            # dedup: the shared-file rule re-picks every enabled stack and
            # a branch can ALSO touch a specific stack dir -- a doubled
            # entry would fmt/plan the same stack twice
            case " $stacks " in *" $1 "*) return 0 ;; esac
            stacks="$stacks $1"
            case " $ENABLED_STACKS " in *" $1 "*) plan="$plan $1" ;; esac
          }
          if [ -n "${INPUT_STACKS:-}" ]; then
            if [ "$INPUT_STACKS" = "auto" ]; then
              # explicit dispatch with auto = "run everything known" (an
              # operator pressed the button; push semantics do not apply)
              for d in $KNOWN_STACKS; do pick "$d"; done
              note="dispatch auto: ALL stacks"
            else
              for s in $INPUT_STACKS; do
                case " $KNOWN_STACKS " in
                  *" $s "*) pick "$s" ;;
                  *) echo "unknown stack '$s'; KNOWN_STACKS: $KNOWN_STACKS"; exit 1 ;;
                esac
              done
              note="dispatch input"
            fi
          elif [ "${EVENT:-push}" = "create" ]; then
            # mirror new ref: branch creation only (tags carry no tofu work)
            if [ "${REFTYPE:-}" != "branch" ]; then
              note="create ref_type=$REFTYPE (not a branch): nothing to gate"
            else
              BASE="main"
              # compare via the Codeberg API (source repo of record; anon
              # read). The Forgejo mirror's own compare endpoint 404s (verified).
              resp=$(curl -fsS "https://codeberg.org/api/v1/repos/blake-hamm/bhamm-lab/compare/${BASE}...${GITHUB_SHA}" 2>/dev/null || true)
              if [ -n "$resp" ]; then
                for d in $(jq -r '
                    (.files // []) as $f
                    | ($known | split(" "))
                    | map(select(. as $s | $f | any(.[]; (.filename // "") | startswith("tofu/" + $s + "/"))))
                    | .[]' <<<"$resp" --arg known "$KNOWN_STACKS"); do
                  pick "$d"
                done
              while IFS= read -r f; do
                hit=0
                for s in $KNOWN_STACKS; do case "$f" in "tofu/$s/"*) hit=1; break ;; esac; done
                [ "$hit" = "0" ] && shared=true
              done < <(jq -r '.files[]?.filename // empty | select(startswith("tofu/"))' <<<"$resp" 2>/dev/null)
                # compare succeeded: zero files under tofu/ => tofu-clean
                # (compare-unavailable fallback above never reaches here)
                [ "$(jq -r '[.files[]? | select((.filename // "") | startswith("tofu/"))] | length' <<<"$resp")" = "0" ] && no_changes=true
                note="create: compare main...tip"
              else
                for d in $KNOWN_STACKS; do pick "$d"; done
                note="create: compare unavailable, ALL stacks"
              fi
            fi
          elif [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # push with before=0000 (mirror branch sync). the create event
            # owns branch-creation gating and sees the FULL branch diff; this
            # push only sees the tip commit, so no-op here to avoid double
            # runs and, worse, a wrong narrow answer.
            note="push before=0000: owned by create event, skipping"
          else
            BASE="$BEFORE"
            resp=$(curl -fsS "https://codeberg.org/api/v1/repos/blake-hamm/bhamm-lab/compare/${BASE}...${GITHUB_SHA}" 2>/dev/null || true)
            if [ -n "$resp" ]; then
              for d in $(jq -r '
                  (.files // []) as $f
                  | ($known | split(" "))
                  | map(select(. as $s | $f | any(.[]; (.filename // "") | startswith("tofu/" + $s + "/"))))
                  | .[]' <<<"$resp" --arg known "$KNOWN_STACKS"); do
                pick "$d"
              done
              while IFS= read -r f; do
                hit=0
                for s in $KNOWN_STACKS; do case "$f" in "tofu/$s/"*) hit=1; break ;; esac; done
                [ "$hit" = "0" ] && shared=true
              done < <(jq -r '.files[]?.filename // empty | select(startswith("tofu/"))' <<<"$resp" 2>/dev/null)
              # compare succeeded: zero files under tofu/ => tofu-clean
              [ "$(jq -r '[.files[]? | select((.filename // "") | startswith("tofu/"))] | length' <<<"$resp")" = "0" ] && no_changes=true
              note="push: compare $BASE...head"
            else
              for d in $KNOWN_STACKS; do pick "$d"; done
              note="compare unavailable: ALL stacks"
            fi
          fi
          if [ "$shared" = "true" ]; then
            # any changed tofu/** file outside a known stack dir (the
            # .terraform-version pin of record, shared modules) changes
            # the planner or inputs for EVERY stack: conservative default
            # is to replan ALL ENABLED stacks -- that full plan coverage
            # IS the evidence, and nothing posts outside the touched set.
            for d in $ENABLED_STACKS; do pick "$d"; done
            note="$note + shared tofu files: all-enabled replan"
          fi
          stacks=$(echo $stacks); plan=$(echo $plan)
          echo "stacks: [$stacks] plan: [$plan] no_changes=$no_changes ($note)"
          echo "stacks=$stacks" >> "$GITHUB_OUTPUT"
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          echo "no_changes=$no_changes" >> "$GITHUB_OUTPUT"
      - name: Post no-changes status (tofu-clean push)
        # exactly one cheap context on every tofu-clean SHA: Forgejo's
        # branch protection treats a required glob matching ZERO statuses
        # as pending-forever, so cicd/tofu:** must always find a match.
        # Posted ONLY when the compare succeeded and nothing under tofu/
        # changed; a SHA that touches tofu posts only its per-stack
        # verdicts (ci job), never this context. main pushes post nothing
        # (same rule as every other status step here).
        if: steps.pick.outputs.no_changes == 'true'
        shell: bash
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          # public domain, not forgejo.server_url (renders the cluster-internal FQDN)
          RUN_URL: https://git.bhamm-lab.com/${{ github.repository }}/actions/runs/${{ forgejo.run_id }}
        run: |
          set +eu pipefail  # reporting must never fail the workflow further
          TOK=$(printf '%s' "${CODEBERG_TOKEN:-}" | tr -d '[:space:]')
          if [ -z "$TOK" ]; then
            echo "FATAL: CODEBERG_TOKEN secret missing/empty."
            echo "The ${STATUS_PREFIX}:no-changes status cannot be published; required checks would wedge."
            echo "Silent-skip was removed on purpose: a missing secret must redden the gate, not hide it."
            exit 1
          fi
          [ "$BRANCH" = "main" ] && { echo "main push, nothing to report"; exit 0; }
          ctx="${STATUS_PREFIX}:no-changes"
          data=$(jq -cn --arg state success --arg url "$RUN_URL" \
            --arg desc 'no tofu changes - nothing to plan' --arg ctx "$ctx" \
            '{state: $state, target_url: $url, description: $desc, context: $ctx}')
          HTTP_CODE=$(curl -sS -o /tmp/nc_body -w '%{http_code}' -X POST \
            -H "Authorization: token $TOK" -H "Content-Type: application/json" \
            --data "$data" "https://codeberg.org/api/v1/repos/blake-hamm/bhamm-lab/statuses/$GITHUB_SHA")
          case "$HTTP_CODE" in
            2*) echo "status $ctx=success" ;;
            *) echo "CODEBERG status POST $ctx -> HTTP $HTTP_CODE"
               head -c 200 /tmp/nc_body 2>/dev/null; echo
               exit 1 ;;
          esac
  ci:
    # one self-contained job for the whole run: fmt -> lint per changed
    # stack, then Vault login + plan for the plan-enabled subset, then the
    # final commit statuses replacing the pending claims posted before any
    # gate work. loops over plain strings because
    # dynamic matrices are broken on this Forgejo (see detect comment).
    needs: detect
    # heavy pipeline: never runs on a tofu-clean push (detect posts the
    # single no-changes status itself) or on tag create events -- empty
    # STACKS means there is nothing to gate, so skip checkout + tools
    # entirely instead of looping over nothing.
    if: needs.detect.outputs.stacks != ''
    runs-on: docker
    container: docker.io/alpine:3.20
    timeout-minutes: 40
    env:
      STACKS: ${{ needs.detect.outputs.stacks }}
      PLANS: ${{ needs.detect.outputs.plan }}
    steps:
      - name: apk deps
        # unzip: tofu + tflint ship as zips; trivy is a tarball
        run: apk add --no-cache curl jq unzip bash python3
      - name: Claim pending statuses (pending-first)
        # pending-first: claim PENDING for exactly the contexts this run
        # will finalize -- one per plan-enabled touched stack -- before any
        # gate work starts. Each gets its final verdict at the end of the
        # run. A run killed mid-pipeline therefore leaves PENDING contexts
        # -- never a stale success, never silence -- so required checks
        # stay unsatisfiable until real verdicts land. Stacks this change
        # did not touch post NOTHING (quiet UI).
        shell: bash
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          # public domain, not forgejo.server_url (renders the cluster-internal FQDN)
          RUN_URL: https://git.bhamm-lab.com/${{ github.repository }}/actions/runs/${{ forgejo.run_id }}
        run: |
          set +eu pipefail  # reporting must never fail the workflow further
          TOK=$(printf '%s' "${CODEBERG_TOKEN:-}" | tr -d '[:space:]')
          if [ -z "$TOK" ]; then
            echo "FATAL: CODEBERG_TOKEN secret missing/empty."
            echo "The per-stack commit statuses cannot be published; required checks would wedge."
            echo "Silent-skip was removed on purpose: a missing secret must redden the gate, not hide it."
            exit 1
          fi
          [ "$BRANCH" = "main" ] && { echo "main push, nothing to report"; exit 0; }
          API=https://codeberg.org/api/v1
          PENDING_FAIL=0
          post_status() {  # post_status <context> <state> <description>
            python3 -c 'import sys, json
          print(json.dumps({"state": sys.argv[1], "target_url": sys.argv[2], "description": sys.argv[3], "context": sys.argv[4]}))' "$2" "$RUN_URL" "$3" "$1" > /tmp/pstatus
            HTTP_CODE=$(curl -sS -o /tmp/pbody -w '%{http_code}' -X POST \
              -H "Authorization: token $TOK" -H "Content-Type: application/json" \
              --data "@/tmp/pstatus" "$API/repos/blake-hamm/bhamm-lab/statuses/$GITHUB_SHA")
            case "$HTTP_CODE" in
              2*) echo "pending status $1=$2" ;;
              *) echo "CODEBERG status POST $1 -> HTTP $HTTP_CODE"
                 head -c 200 /tmp/pbody 2>/dev/null; echo
                 PENDING_FAIL=1 ;;
            esac
          }
          for sdir in $PLANS; do
            sfid=$(echo "$sdir" | tr '/' '-')
            post_status "${STATUS_PREFIX}:$sfid" pending "plan in progress"
          done
          if [ "$PENDING_FAIL" = "1" ]; then
            echo "FATAL: one or more pending statuses could not be published (token scope? see diagnostics above)"
            exit 1
          fi
      - name: Checkout (Forgejo archive endpoint; no external actions by design)
        run: |
          curl -fsSL -o /tmp/repo.tar.gz "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE"
          tar xzf /tmp/repo.tar.gz -C "$GITHUB_WORKSPACE" --strip-components=1
      - name: Download tools
        run: |
          # pin of record: tofu/.terraform-version (read from the checkout);
          # the workflow env value is only a fallback for refs predating it.
          OTV="${OPENTOFU_VERSION}"
          if [ -f "$GITHUB_WORKSPACE/tofu/.terraform-version" ]; then
            fv=$(grep -v '^[[:space:]]*#' "$GITHUB_WORKSPACE/tofu/.terraform-version" | tr -d '[:space:]')
            if [ -n "$fv" ]; then case "$fv" in v*) OTV="$fv" ;; *) OTV="v$fv" ;; esac; fi
          fi
          curl -fsSL -o /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/${OTV}/tofu_${OTV#v}_linux_amd64.zip"
          unzip -o /tmp/tofu.zip -d /usr/local/bin
          curl -fsSL -o /tmp/tflint.zip "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          unzip -o /tmp/tflint.zip -d /usr/local/bin
          # trivy asset names drop the leading v (v0.76.1 -> 0.76.1); the
          # v-prefixed URL 404s (validate.yml run #18: curl 22 + tar short read)
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" | tar xz -C /usr/local/bin
      - name: tofu fmt + lint (all changed stacks)
        shell: bash
        run: |
          set -uo pipefail
          # defense in depth: an inherited xtrace would echo every fetched
          # credential the moment it lands in a variable
          set +x
          mkdir -p /tmp/results
          rc_all=0
          for dir in $STACKS; do
            id=$(echo "$dir" | tr '/' '-')
            fmt=pass; lint=fail
            if (cd "$GITHUB_WORKSPACE" && tofu fmt -check -recursive "tofu/$dir"); then
              echo "fmt pass: $dir"
            else
              fmt=fail; rc_all=1; echo "fmt FAIL: $dir"
            fi
            # init -backend=false: stateless, no creds needed; providers come
            # from registry.opentofu.org. fmt failure does not stop lint:
            # every stage reports its own verdict.
            if (cd "$GITHUB_WORKSPACE/tofu/$dir" && tofu init -backend=false -input=false                 && tofu validate && tflint --format=compact                 && trivy config --quiet .); then
              lint=pass
            else
              rc_all=1; echo "lint FAIL: $dir"
            fi
            echo "fmt=$fmt lint=$lint" > "/tmp/results/$id.fmtlint"
          done
          exit $rc_all
      - name: Vault login (kubernetes auth, role ci)
        id: vault
        shell: bash
        run: |
          set -eu pipefail
          if [ -z "${PLANS:-}" ]; then echo "no plan-enabled stacks; skipping"; exit 0; fi
          # no set -x anywhere in this workflow: secret values must never reach the logs
          [ -r /var/run/secrets/kubernetes.io/serviceaccount/token ] || {
            echo "SA token not present in the job container (missing runner container.options bind?)"
            exit 1
          }
          RESP=$(curl -fsS -k -X POST \
            -H "Content-Type: application/json" \
            -d "{\"role\":\"ci\",\"jwt\":\"$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)\"}" \
            https://vault.vault:8200/v1/auth/kubernetes/login)
          TOKEN=$(printf '%s' "$RESP" | jq -r .auth.client_token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "VAULT LOGIN FAILED: empty client_token (check role 'ci' SA binding / policy 'ci_secrets')"
            printf '%s' "$RESP" | head -c 400; echo
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "$TOKEN" > /tmp/vault-token
          echo "vault login OK (role ci, ttl 1h)"
      - name: tofu plan + apply (plan-enabled stacks)
        shell: bash
        run: |
          set -uo pipefail
          # defense in depth: an inherited xtrace would echo every fetched
          # credential the moment it lands in a variable
          set +x
          [ -n "${PLANS:-}" ] || { echo "no plan-enabled stacks in this run"; exit 0; }
          TOKEN=$(cat /tmp/vault-token)
          read_secret() {
            # bracket accessor via --arg: unquoted hyphenated keys (terraform-token) are a jq compile error
            curl -fsS -k -H "X-Vault-Token: $TOKEN" "https://vault.vault:8200/v1/$1" | jq -r --arg p "$2" '.data.data[$p]'
          }
          mask() {
            # The runner consumes ::add-mask:: directives ONE physical line at
            # a time: echoing a MULTI-LINE value as `::add-mask::$v`
            # registers only its first line and leaks every remaining line as
            # plain stdout (run 288: the gcp SA JSON private key printed in the
            # job log). Register each line separately instead: directive lines
            # never reach the log, and each registered line is redacted if it
            # reappears in later output.
            local v line
            for v in "$@"; do
              while IFS= read -r line; do
                # >=8 chars: single-punctuation lines (braces) would mask
                # every brace in the remaining log; they carry no secret
                # material (key PEM / base64 lines are always long).
                if [ "${#line}" -ge 8 ]; then echo "::add-mask::$line"; fi
              done <<< "$v"
            done
          }
          grab() {  # grab VAR_NAME vault-path property
            # Read + mask BEFORE the value is exported or used. mask runs here,
            # OUTSIDE the command substitution: an ::add-mask:: line echoed
            # inside a command substitution is captured into the value instead
            # of reaching the runner log.
            local v
            v=$(read_secret "$2" "$3")
            mask "$v"
            printf -v "$1" '%s' "$v"
          }
          rc_all=0
          for dir in $PLANS; do
            fid=$(echo "$dir" | tr '/' '-')
            # clear any env a previous stack's arm exported so state never
            # bleeds between plans
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY PROXMOX_VE_USERNAME PROXMOX_VE_PASSWORD NUT_PASSWORD GOOGLE_CREDENTIALS
            unset TF_VAR_b2_application_key_id TF_VAR_b2_application_key
            unset TF_VAR_cloudflare_api_token TF_VAR_cloudflare_account_id TF_VAR_tunnel_secret
            PLAN_EXTRA=()
            case "$dir" in
              proxmox/garage)
                grab AWS_ACCESS_KEY_ID secret/data/core/ceph s3_access_key
                export AWS_ACCESS_KEY_ID
                grab AWS_SECRET_ACCESS_KEY secret/data/core/ceph s3_secret_key
                export AWS_SECRET_ACCESS_KEY
                grab PROXMOX_VE_USERNAME secret/data/external/proxmox PROXMOX_VE_USERNAME
                export PROXMOX_VE_USERNAME
                grab PROXMOX_VE_PASSWORD secret/data/external/proxmox PROXMOX_VE_PASSWORD
                export PROXMOX_VE_PASSWORD
                # plan against method's VLAN 30 address, not the stack default on
                # VLAN 20: the job pod is on VLAN 30 with jumbo frames (Cilium MTU
                # 8950) while inter-VLAN routing caps at 1500 and drops jumbo-sized
                # TLS segments silently, which the provider reports as EOF.
                # Staying on-link keeps the flow switched at jumbo. Proven by
                # ci-vault-smoke; see docker/docs-site/docs/architecture/network.md.
                PLAN_EXTRA=(-var proxmox_url=https://10.0.30.11:8006)
                ;;
              proxmox/talos)
                # Same VLAN-30 jumbo-frame workaround as proxmox/garage (see
                # its comment). The plan step passes no -var-file (garage
                # relies on bare -vars + provider defaults), so talos passes
                # prod.tfvars explicitly -- the live (prod) environment's
                # var file ('green' survives only in legacy cluster
                # naming, not in workspaces; no green.tfvars).
                # backend creds: state lives on RGW like every stack
                grab AWS_ACCESS_KEY_ID secret/data/core/ceph s3_access_key
                export AWS_ACCESS_KEY_ID
                grab AWS_SECRET_ACCESS_KEY secret/data/core/ceph s3_secret_key
                export AWS_SECRET_ACCESS_KEY
                grab PROXMOX_VE_USERNAME secret/data/external/proxmox PROXMOX_VE_USERNAME
                export PROXMOX_VE_USERNAME
                grab PROXMOX_VE_PASSWORD secret/data/external/proxmox PROXMOX_VE_PASSWORD
                export PROXMOX_VE_PASSWORD
                grab NUT_PASSWORD secret/data/core/orangepi password
                export NUT_PASSWORD
                PLAN_EXTRA=(-var proxmox_url=https://10.0.30.11:8006 -var-file=prod.tfvars -var nut_password="$NUT_PASSWORD")
                ;;
              backblaze)
                # backend creds: state lives on RGW like every stack
                grab AWS_ACCESS_KEY_ID secret/data/core/ceph s3_access_key
                export AWS_ACCESS_KEY_ID
                grab AWS_SECRET_ACCESS_KEY secret/data/core/ceph s3_secret_key
                export AWS_SECRET_ACCESS_KEY
                # provider creds: the account's master app key. plan exercises
                # only the read subset (listBuckets/listKeys/
                # readBucketEncryption); the same Vault path will feed future
                # applies, and any B2 key that can writeKeys is full-account
                # anyway per B2 docs, so a narrower apply credential buys
                # nothing. TF_VAR_ naming: the b2 provider reads variables
                # (var.b2_*), unlike proxmox which reads bare env.
                grab TF_VAR_b2_application_key_id secret/data/external/backblaze-admin B2_APPLICATION_KEY_ID
                export TF_VAR_b2_application_key_id
                grab TF_VAR_b2_application_key secret/data/external/backblaze-admin B2_APPLICATION_KEY
                export TF_VAR_b2_application_key
                ;;
              cloudflare)
                # backend creds: state lives on RGW like every stack
                grab AWS_ACCESS_KEY_ID secret/data/core/ceph s3_access_key
                export AWS_ACCESS_KEY_ID
                grab AWS_SECRET_ACCESS_KEY secret/data/core/ceph s3_secret_key
                export AWS_SECRET_ACCESS_KEY
                # provider creds: Vault external/cloudflare (ci_secrets policy
                # already grants read+list). Property names match the plaintext
                # key names in secrets.enc.json synced by the sops->vault job.
                # Passed via PLAN_EXTRA -var flags (not TF_VAR_ env) so values
                # never linger in the job env between stacks.
                grab CF_API_TOKEN secret/data/external/cloudflare terraform-token
                grab CF_ACCOUNT_ID secret/data/external/cloudflare account-id
                grab CF_TUNNEL_SECRET secret/data/external/cloudflare tunnel_secret
                PLAN_EXTRA=(-var cloudflare_api_token="$CF_API_TOKEN" -var cloudflare_account_id="$CF_ACCOUNT_ID" -var tunnel_secret="$CF_TUNNEL_SECRET")
                ;;
              gcp)
                # backend creds: state lives on RGW like every stack
                grab AWS_ACCESS_KEY_ID secret/data/core/ceph s3_access_key
                export AWS_ACCESS_KEY_ID
                grab AWS_SECRET_ACCESS_KEY secret/data/core/ceph s3_secret_key
                export AWS_SECRET_ACCESS_KEY
                # provider creds: least-priv service-account JSON synced from
                # SOPS to Vault external/gcp-cicd (property google_credentials). The
                # google provider consumes GOOGLE_CREDENTIALS natively as the
                # JSON string, so this is bare env (not TF_VAR_): providers.tf
                # wires only project/region; project_id has a stack default.
                # gcp is in APPLY_STACKS: PR-as-deployment applies it on push.
                grab GOOGLE_CREDENTIALS secret/data/external/gcp-cicd google_credentials
                export GOOGLE_CREDENTIALS
                ;;
              *)
                echo "no credential wiring for stack '$dir' (ENABLED_STACKS outpaced the plan step)"
                echo "status=fail summary=no credential wiring" > "/tmp/results/$fid.plan"
                rc_all=1
                continue
                ;;
            esac
            ( cd "$GITHUB_WORKSPACE/tofu/$dir"
              # Workspace pin: proxmox/talos state lives in the named
              # workspace 'prod' (S3 backend, no workspace_key_prefix ->
              # key env:/prod/proxmox/talos/terraform.state); every other
              # stack uses the default workspace. A future 'test'
              # workspace/cluster for the same stack is a one-line addition.
              TOFU_WS=""
              case "$dir" in
                proxmox/talos) TOFU_WS="prod" ;;
              esac
              if [ -n "$TOFU_WS" ]; then
                # backend init WITHOUT TF_WORKSPACE: pointing TF_WORKSPACE at
                # a workspace missing from the backend silently auto-creates
                # it with empty state and the plan would try to create the
                # whole cluster. So: init, list, assert, THEN pin.
                tofu init -input=false
                if ! tofu workspace list | grep -qw "$TOFU_WS"; then
                  echo "FATAL: tofu workspace '$TOFU_WS' does not exist in the backend for $dir; refusing to plan (TF_WORKSPACE would auto-create it with empty state)"
                  echo "status=fail summary=workspace $TOFU_WS missing" > "/tmp/results/$fid.plan"
                  exit 1
                fi
                export TF_WORKSPACE="$TOFU_WS"
                tofu init -reconfigure -input=false
              else
                tofu init -input=false
              fi
              rc=0
              # -out saves a binary plan (what apply later runs); tofu prints
              # the human plan to stdout and tee doubles it into the job log
              # -- the run log is the diagnostic surface.
              tofu plan -input=false "${PLAN_EXTRA[@]}" -detailed-exitcode -out "/tmp/$fid.tfplan" > >(tee /tmp/plan-raw.txt) 2>&1 || rc=$?
              wait
              if [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ]; then
                if [ "$rc" -eq 2 ]; then SUMMARY="passed (changes pending)"; else SUMMARY="passed (no changes)"; fi
                echo "status=pass summary=$SUMMARY" > "/tmp/results/$fid.plan"
              else
                SUMMARY="failed (rc=$rc)"
                echo "status=fail summary=$SUMMARY" > "/tmp/results/$fid.plan"
                rc_all=1
              fi
              echo "plan $dir: $SUMMARY"
              # PR = deployment: APPLY_STACKS is the apply allow-list (the
              # Vault credential wiring above is the blast-radius control).
              # ENABLED_STACKS only plans: a stack with pending changes that
              # is not in APPLY_STACKS records plan-only and skips apply.
              # Apply the SAVED plan file: what the plan rendered is exactly
              # what runs. No -var flags here -- variables are baked into the
              # plan file. rc==0 means no changes: nothing to apply.
              # The commit status carries only the verdict; the full apply log
              # lives in the run logs.
              case " $APPLY_STACKS " in *" $dir "*) APPLY_OK=1 ;; *) APPLY_OK=0 ;; esac
              if [ "$rc" -eq 2 ] && [ "$APPLY_OK" = "1" ]; then
                # apply output: tee into the job log. tofu masks sensitive
                # attributes itself ((sensitive value)) and `apply <planfile>`
                # prints progress lines, not raw diffs -- safe for the log.
                tofu apply -input=false "/tmp/$fid.tfplan" > >(tee /tmp/apply.txt) 2>&1
                arc=$?
                wait
                if [ "$arc" -eq 0 ]; then
                  ACOUNTS=$(grep '^Apply complete!' /tmp/apply.txt | sed 's/^Apply complete! //')
                  echo "status=pass summary=${ACOUNTS:-applied}" > "/tmp/results/$fid.apply"
                else
                  echo "status=fail summary=apply failed (see run logs)" > "/tmp/results/$fid.apply"
                  rc_all=1
                fi
              elif [ "$rc" -eq 2 ]; then
                # plan-only: changes pending, but this stack is not in
                # APPLY_STACKS -- record the distinct status, skip apply
                echo "status=plan-only summary=plan-only (apply disabled)" > "/tmp/results/$fid.apply"
              else
                echo "status=skip summary=no changes" > "/tmp/results/$fid.apply"
              fi
            )
          done
          exit $rc_all
      - name: Finalize commit statuses on Codeberg
        # always(): a failed fmt/lint/plan is exactly the event the commit
        # statuses must report; the job still ends red via the failed step's
        # exit. Replaces the pending claims posted before gate work.
        if: always()
        shell: bash
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          # public domain, not forgejo.server_url (renders the cluster-internal FQDN)
          RUN_URL: https://git.bhamm-lab.com/${{ github.repository }}/actions/runs/${{ forgejo.run_id }}
        run: |
          set +eu pipefail  # reporting must never fail the workflow further
          TOK=$(printf '%s' "${CODEBERG_TOKEN:-}" | tr -d '[:space:]')
          if [ -z "$TOK" ]; then
            echo "FATAL: CODEBERG_TOKEN secret missing/empty."
            echo "The per-stack commit statuses cannot be published; required checks would wedge."
            echo "Silent-skip was removed on purpose: a missing secret must redden the gate, not hide it."
            exit 1
          fi
          [ "$BRANCH" = "main" ] && { echo "main push, nothing to report"; exit 0; }
          API=https://codeberg.org/api/v1
          api() {  # api METHOD URL [data-file]; prints body, sets global HTTP_CODE
            local method="$1" url="$2" data="${3:-}"
            if [ -n "$data" ]; then
              HTTP_CODE=$(curl -sS -o /tmp/api_body -w '%{http_code}' -X "$method" \
                -H "Authorization: token $TOK" -H "Content-Type: application/json" --data "@$data" "$url")
            else
              HTTP_CODE=$(curl -sS -o /tmp/api_body -w '%{http_code}' -X "$method" \
                -H "Authorization: token $TOK" "$url")
            fi
            cat /tmp/api_body
          }
          # --- final verdicts: replace the pending claims posted before
          # gate work, one per plan-enabled touched stack -- the exact set
          # the pending step claimed. Untouched stacks and touched-but-not
          # plan-enabled stacks post nothing. Branch pushes only (main
          # exited above); statuses key on SHA. ---
          STATUS_FAIL=0
          post_status() {  # post_status <context> <state> <description>
            python3 -c 'import sys, json
          print(json.dumps({"state": sys.argv[1], "target_url": sys.argv[2], "description": sys.argv[3], "context": sys.argv[4]}))' "$2" "$RUN_URL" "$3" "$1" > /tmp/status_data
            api POST "$API/repos/blake-hamm/bhamm-lab/statuses/$GITHUB_SHA" /tmp/status_data >/dev/null
            case "$HTTP_CODE" in
              2*) echo "status $1=$2" ;;
              *) echo "CODEBERG status POST $1 -> HTTP $HTTP_CODE"
                 head -c 200 /tmp/api_body 2>/dev/null; echo
                 STATUS_FAIL=1 ;;
            esac
          }
          # PLANS is exactly the set the pending step claimed: touched AND
          # plan-enabled. Untouched stacks post nothing; a touched-but-not
          # plan-enabled stack (kubernetes) has no credential/plan path, so
          # it also posts nothing (fmt/lint still gate the job's exit code).
          for sdir in $PLANS; do
            sfid=$(echo "$sdir" | tr '/' '-')
            sfmt=$(cat "/tmp/results/$sfid.fmtlint" 2>/dev/null)
            splan=$(cat "/tmp/results/$sfid.plan" 2>/dev/null)
            sapply=$(cat "/tmp/results/$sfid.apply" 2>/dev/null)
            if [ -z "$sfmt" ] || [ -z "$splan" ]; then
              sstate=failure; sdesc="$sdir: did not complete (see run logs)"
            elif [ "$sfmt" != "fmt=pass lint=pass" ]; then
              sstate=failure; sdesc="$sdir: fmt or lint failed"
            elif [ "${splan#status=pass}" != "$splan" ]; then
              case "$sapply" in
                status=fail*) sstate=failure; sdesc="$sdir: apply failed (see run logs)" ;;
                status=plan-only*) sstate=success; sdesc="$sdir: plan ok (apply disabled)" ;;
                status=skip*) sstate=success; sdesc="$sdir: plan ok" ;;
                *) sstate=success; sdesc="$sdir: plan ok; applied" ;;
              esac
            else
              sstate=failure; sdesc="$sdir: plan failed (rc not 0 or 2)"
            fi
            post_status "${STATUS_PREFIX}:$sfid" "$sstate" "$sdesc"
          done
          if [ "$STATUS_FAIL" = "1" ]; then
            echo "FATAL: one or more commit statuses could not be published (token scope? see diagnostics above)"
            exit 1
          fi
