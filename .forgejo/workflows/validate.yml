name: validate
on:
  workflow_dispatch:
  # the Forgejo repo is a mirror of Codeberg; mirror sync fires a push
  # event (verified in Forgejo source: SyncPullMirror -> SyncPushCommits
  # -> HookEventPush), and a Codeberg webhook triggers an immediate
  # mirror-sync on push. pull_request never fires on a mirror, so this
  # runs on every push to any branch: cheap validation, and it gives
  # pre-merge CI signal on feature branches (including renovate pushes).
  # ** spans / separators; * does not — run history proved it
  push:
    branches:
      - "**"
# tool pins; this block is the pin of record (see
# docker/docs-site/docs/operations/ci-validation.md). bump a version here
# and the matching download step follows.
env:
  YAMLFMT_VERSION: v0.12.1
  SHFMT_VERSION: v3.8.0
  GITLEAKS_VERSION: v8.18.2
  RIPSECRETS_VERSION: v0.1.8
  KUBECONFORM_VERSION: v0.6.7
  OPENTOFU_VERSION: v1.13.2
  TFLINT_VERSION: v0.65.0
  TRIVY_VERSION: v0.76.1
  CRANE_VERSION: v0.20.2
  # uv release tags carry no leading v (0.13.6, not v0.13.6)
  UV_VERSION: 0.13.6
  # matches Talos v1.12.6 -> k8s 1.35; keep in sync with
  # tofu/proxmox/talos/variables.tf talos_version
  KUBE_VERSION: "1.35.0"
jobs:
  lint:
    # registered label of the prod runner (default registration label)
    runs-on: docker
    container: docker.io/alpine:3.20
    steps:
      - name: apk deps
        # grep = GNU grep: alpine's busybox grep has no -P, and without it
        # the tab check below would silently no-op (busybox exits 2 on the
        # unknown flag, which the ! prefix inverts into a pass)
        run: apk add --no-cache curl bash grep
      - name: Checkout (Forgejo archive endpoint; no external actions by design)
        run: |
          curl -fsSL -o /tmp/repo.tar.gz "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE"
          tar xzf /tmp/repo.tar.gz -C "$GITHUB_WORKSPACE" --strip-components=1
      - name: Download tools
        run: |
          curl -fsSL "https://github.com/google/yamlfmt/releases/download/${YAMLFMT_VERSION}/yamlfmt_${YAMLFMT_VERSION#v}_Linux_x86_64.tar.gz" | tar xz -C /usr/local/bin
          curl -fsSL -o /usr/local/bin/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x /usr/local/bin/shfmt
      - name: yamlfmt (reads ./.yamlfmt from repo root)
        run: yamlfmt -lint .
      - name: shfmt
        # -i 2: the repo's 2-space convention (forbid-tabs +
        # remove-tabs --whitespaces-count 2); plain shfmt defaults to tab
        # indentation and would fight the forbid-tabs rule
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shfmt -d -s -i 2
      - name: trailing whitespace
        # block scalar: a bare ! at the start of a YAML plain scalar is a
        # tag indicator and would be stripped before the shell sees it
        run: |
          ! grep -rIn ' $' --exclude-dir=.git .
      - name: tabs
        # .gitmodules legitimately contains tabs -> excluded
        run: |
          ! grep -rIlP '\t' --exclude-dir=.git --exclude=.gitmodules .
      - name: CRLF
        shell: bash
        run: |
          ! grep -rIl "$(printf '\r')" --exclude-dir=.git .
  secrets:
    runs-on: docker
    container: docker.io/alpine:3.20
    steps:
      - name: apk deps
        # gcompat: ripsecrets ships glibc-only builds (run #19: ENOENT
        # reported as "xargs: ripsecrets: No such file or directory");
        # gcompat provides /lib64/ld-linux-x86-64.so.2 so they exec
        # libgcc: ripsecrets' Rust panic path needs libgcc_s.so.1 and its
        # 12 _Unwind_* symbols (run #20), which alpine's libgcc package
        # exports in full (verified with nm -D)
        run: apk add --no-cache curl gcompat libgcc
      - name: Checkout (Forgejo archive endpoint; no external actions by design)
        run: |
          curl -fsSL -o /tmp/repo.tar.gz "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE"
          tar xzf /tmp/repo.tar.gz -C "$GITHUB_WORKSPACE" --strip-components=1
      - name: Download tools
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" | tar xz -C /usr/local/bin
          # ripsecrets tarball nests the binary in a versioned dir; busybox
          # tar + --strip-components does not land it on PATH (run #18:
          # exit 127). Extract to a temp dir and install whatever we find.
          mkdir -p /tmp/rips && curl -fsSL "https://github.com/sirwart/ripsecrets/releases/download/${RIPSECRETS_VERSION}/ripsecrets-${RIPSECRETS_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /tmp/rips
          install -m 0755 "$(find /tmp/rips -type f -name ripsecrets)" /usr/local/bin/ripsecrets
      - name: gitleaks (tree scan)
        # tree scan only, never history: 7 stale hits live in old commits
        # by design (the fixes are in the tree; history is immutable)
        run: gitleaks detect --no-git --redact
      - name: ripsecrets
        # bare scan: ripsecrets skips .git itself and honors
        # .secretsignore (the previous find|xargs exclusion pipeline
        # silently no-op'd under alpine busybox — run #21 flagged the
        # WireGuard public-key false positive anyway)
        run: ripsecrets
  k8s-schemas:
    runs-on: docker
    container: docker.io/alpine:3.20
    steps:
      - name: apk deps
        run: apk add --no-cache curl
      - name: Checkout (Forgejo archive endpoint; no external actions by design)
        run: |
          curl -fsSL -o /tmp/repo.tar.gz "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE"
          tar xzf /tmp/repo.tar.gz -C "$GITHUB_WORKSPACE" --strip-components=1
      - name: Download tools
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /usr/local/bin
      - name: kubeconform
        # -ignore-missing-schemas: ~23 CRD kinds lack core schemas
        # (Application, Certificate, CiliumNetworkPolicy, ClusterIssuer,
        # ClusterSecretStore, ClusterTunnel, Middleware, PushSecret,
        # ServiceMonitor, Vault, Workflow, WorkflowTemplate, CronWorkflow,
        # Kustomization, ...)
        run: find kubernetes/manifests \( -name '*.yaml' -o -name '*.yml' \) -print0 | xargs -0 kubeconform -strict -ignore-missing-schemas -kubernetes-version "$KUBE_VERSION" -summary
  open-tofu:
    runs-on: docker
    container: docker.io/alpine:3.20
    steps:
      - name: apk deps
        # unzip: tofu + tflint ship as zips
        run: apk add --no-cache curl unzip
      - name: Checkout (Forgejo archive endpoint; no external actions by design)
        run: |
          curl -fsSL -o /tmp/repo.tar.gz "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE"
          tar xzf /tmp/repo.tar.gz -C "$GITHUB_WORKSPACE" --strip-components=1
      - name: Download tools
        run: |
          curl -fsSL -o /tmp/tofu.zip "https://github.com/opentofu/opentofu/releases/download/${OPENTOFU_VERSION}/tofu_${OPENTOFU_VERSION#v}_linux_amd64.zip"
          unzip -o /tmp/tofu.zip -d /usr/local/bin
          curl -fsSL -o /tmp/tflint.zip "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          unzip -o /tmp/tflint.zip -d /usr/local/bin
          # trivy asset names drop the leading v (v0.76.1 -> 0.76.1); the
          # v-prefixed URL 404s (run #18: curl 22 + tar short read)
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" | tar xz -C /usr/local/bin
      - name: tofu fmt
        run: tofu fmt -check -recursive tofu/
      - name: tofu init/validate + tflint (per env)
        # init -backend=false: stateless, no creds needed; providers come
        # from registry.opentofu.org
        # tflint with no ruleset file = built-in rules only (intended)
        run: |
          for env in backblaze cloudflare gcp kubernetes proxmox/garage proxmox/talos; do
            tofu -chdir="tofu/$env" init -backend=false -input=false
            tofu -chdir="tofu/$env" validate
            tflint --chdir="tofu/$env" --format=compact
          done
      - name: trivy config
        # trivy config exits 0 even with findings — advisory here
        run: trivy config --quiet tofu/
  ansible:
    runs-on: docker
    container: docker.io/alpine:3.20
    env:
      # prometheus.prometheus 0.29.1 caps ansible-core at <=2.20.99; the
      # uv default (2.21) fails resolution
      ANSIBLE_CORE_SPEC: "ansible-core>=2.19,<2.20"
      # uv auto-picks the newest CPython; ansible-core 2.19 is not
      # 3.15-compatible (dataclasses._is_type removed in 3.15; run #20)
      UV_PYTHON: "3.12"
    steps:
      - name: apk deps
        # git: galaxy installs lae.proxmox from a git URL. No py3-pip:
        # alpine >=3.19 marks python externally-managed (PEP 668), so
        # `pip install` system-wide fails by design — uv comes from its
        # static binary instead
        run: apk add --no-cache curl git
      - name: Checkout (Forgejo archive endpoint; no external actions by design)
        run: |
          curl -fsSL -o /tmp/repo.tar.gz "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE"
          tar xzf /tmp/repo.tar.gz -C "$GITHUB_WORKSPACE" --strip-components=1
      - name: install uv
        # the musl build is REQUIRED on alpine: the gnu build is
        # glibc-dynamic and fails exec with ENOENT, reported misleadingly
        # as "uv: not found" (run #19). Tarball nests the binary in a
        # versioned dir; install whatever we find.
        run: |
          mkdir -p /tmp/uv && curl -fsSL "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-musl.tar.gz" | tar xz -C /tmp/uv
          install -m 0755 "$(find /tmp/uv -type f -name uv)" /usr/local/bin/uv
      - name: ansible-galaxy install
        # roles land in ansible/collections (ansible.cfg collections_path);
        # collections land in ./ansible_collections at repo root
        run: |
          uv run --with "$ANSIBLE_CORE_SPEC" --no-project ansible-galaxy install -r ansible/requirements.yml -p ansible/collections
          uv run --with "$ANSIBLE_CORE_SPEC" --no-project ansible-galaxy collection install -r ansible/requirements.yml
      - name: ansible-playbook syntax check
        # ANSIBLE_COLLECTIONS_PATH=. : ansible.cfg collections_path points
        # at ansible/collections only; the env var (precedence over ini)
        # also covers ./ansible_collections where the collections step put
        # them. Verified sequence, 2026-10-26.
        run: ANSIBLE_CONFIG=ansible.cfg ANSIBLE_COLLECTIONS_PATH=. uv run --with "$ANSIBLE_CORE_SPEC" --no-project ansible-playbook --syntax-check ansible/main.yml
  image-digests:
    runs-on: docker
    container: docker.io/alpine:3.20
    steps:
      - name: apk deps
        run: apk add --no-cache curl
      - name: Checkout (Forgejo archive endpoint; no external actions by design)
        run: |
          curl -fsSL -o /tmp/repo.tar.gz "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/archive/$GITHUB_SHA.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE"
          tar xzf /tmp/repo.tar.gz -C "$GITHUB_WORKSPACE" --strip-components=1
      - name: Download tools
        run: |
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar xz -C /usr/local/bin
      - name: crane digest (every image ref must resolve)
        # harbor.bhamm-lab.com refs are skipped: private registry, CI creds
        # arrive later (S4)
        # .ci/digest-exceptions.txt: dead/renovate-ignore-candidate upstreams
        # kept visible; the file must trend to empty
        run: |
          grep -rhoE 'image:[[:space:]]*[^" ]+' kubernetes/manifests | sed 's/^image:[[:space:]]*//' |
            sort -u | grep -v '{' | grep -v '\$' | grep -v '^harbor\.bhamm-lab\.com' > /tmp/refs
          while read -r ref; do
            if grep -v '^[[:space:]]*#' .ci/digest-exceptions.txt 2>/dev/null | grep -qxF "$ref"; then
              echo "SKIP (known upstream, tracked in .ci/digest-exceptions.txt): $ref"; continue
            fi
            case "$ref" in *:*) ;; *) ref="$ref:latest";; esac
            echo "INSPECT $ref"
            crane digest "$ref" >/dev/null || { echo "NOT PULLABLE: $ref"; exit 1; }
          done < /tmp/refs
  report:
    # pull_request never fires on the mirror, so the result is pushed back
    # over the Codeberg API (source repo: codeberg.org/blake-hamm/bhamm-lab)
    # forgejo.* contexts (not github.*): the workflow runs on Forgejo
    # always(): report the outcome of the jobs above, pass or fail
    needs: [lint, secrets, k8s-schemas, open-tofu, ansible, image-digests]
    if: always()
    runs-on: docker
    container: docker.io/alpine:3.20
    timeout-minutes: 5
    steps:
      - name: apk deps
        # python3: JSON parsing for the Codeberg API responses
        run: apk add --no-cache bash curl python3
      - name: Post result to Codeberg PR
        shell: bash
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          # public domain, not forgejo.server_url (renders the cluster-internal FQDN)
          RUN_URL: https://git.bhamm-lab.com/${{ github.repository }}/actions/runs/${{ forgejo.run_id }}
          OVERALL: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          set +eu pipefail  # runner injects -e; reporting must never fail CI
          # tokens pasted from a browser clipboard can carry a trailing
          # newline -> malformed Authorization header -> 401; strip all
          # whitespace before use
          TOK=$(printf '%s' "${CODEBERG_TOKEN:-}" | tr -d '[:space:]')
          [ -n "$TOK" ] || { echo "no CODEBERG_TOKEN secret, skipping"; exit 0; }
          [ "$BRANCH" = "main" ] && { echo "main push, nothing to report"; exit 0; }
          API=https://codeberg.org/api/v1
          api() {  # api METHOD URL [data-file] ; prints body, sets global HTTP_CODE
            local method="$1" url="$2" data="${3:-}"
            if [ -n "$data" ]; then
              HTTP_CODE=$(curl -sS -o /tmp/api_body -w '%{http_code}' -X "$method" \
                -H "Authorization: token $TOK" -H "Content-Type: application/json" --data "@$data" "$url")
            else
              HTTP_CODE=$(curl -sS -o /tmp/api_body -w '%{http_code}' -X "$method" \
                -H "Authorization: token $TOK" "$url")
            fi
            cat /tmp/api_body
          }
          check() {  # check METHOD URL : non-2xx -> diagnostic, exit 0 (non-fatal)
            case "$HTTP_CODE" in
              2*) ;;
              *) echo "CODEBERG API $1 $2 -> HTTP $HTTP_CODE"
                 head -c 200 /tmp/api_body 2>/dev/null; echo
                 echo "report failed (non-fatal)"
                 exit 0 ;;
            esac
          }
          jsonq() {  # jsonq <expr> : eval with `data` bound to /tmp/api_body;
                    # never throws on unexpected payloads (prints empty instead)
            python3 -c '
          import sys, json, os
          try:
              data = json.load(sys.stdin)
          except (json.JSONDecodeError, ValueError):
              data = []
          try:
              print(eval(sys.argv[1]))
          except Exception:
              pass
          ' "$1" < /tmp/api_body
          }
          # only json.load after a 2xx check (see check) so a 4xx body
          # can never reach the parser
          api GET "$API/repos/blake-hamm/bhamm-lab/pulls?state=open&limit=50" >/dev/null
          check GET "$API/repos/blake-hamm/bhamm-lab/pulls?state=open&limit=50"
          PR=$(jsonq 'next((p["number"] for p in data if p.get("head", {}).get("ref") == os.environ.get("BRANCH", "")), "")') || PR=""
          [ -n "$PR" ] || { echo "no open PR for $BRANCH"; exit 0; }
          if [ "$OVERALL" = "true" ]; then RESULT=':x: failed'; else RESULT=':white_check_mark: passed'; fi
          BODY="<!-- forgejo-validate -->
          **Forgejo CI:** $RESULT on \`$BRANCH\` — [run logs]($RUN_URL)"
          # update the existing marker comment if present, else create
          api GET "$API/repos/blake-hamm/bhamm-lab/issues/$PR/comments?limit=100" >/dev/null
          check GET "$API/repos/blake-hamm/bhamm-lab/issues/$PR/comments?limit=100"
          CID=$(jsonq 'next((c["id"] for c in data if "forgejo-validate" in (c.get("body") or "")), "")') || CID=""
          if [ -n "$CID" ]; then
            METHOD=PATCH; URL="$API/repos/blake-hamm/bhamm-lab/issues/comments/$CID"
          else
            METHOD=POST; URL="$API/repos/blake-hamm/bhamm-lab/issues/$PR/comments"
          fi
          python3 -c 'import sys, json
          print(json.dumps({"body": sys.argv[1]}))' "$BODY" > /tmp/api_data
          api "$METHOD" "$URL" /tmp/api_data >/dev/null
          check "$METHOD" "$URL"
          echo "posted to PR #$PR"
