apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: firecrawl-common
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "26"
spec:
  destination:
    namespace: firecrawl
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://codeberg.org/blake-hamm/bhamm-lab.git
    targetRevision: main
    path: kubernetes/charts/common
    helm:
      valuesObject:
        name: firecrawl
        ingressRoutes:
          - name: firecrawl
            ingressClass: traefik-external
            routes:
              - match: Host(`firecrawl.bhamm-lab.com`)
                kind: Rule
                middlewares:
                  - name: default-headers
                  - name: forwardauth-authelia
                services:
                  - name: firecrawl-firecrawl-api
                    scheme: http
                    port: 3002
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
