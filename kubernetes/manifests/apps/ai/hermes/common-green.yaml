apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes-common
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  destination:
    namespace: hermes
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://codeberg.org/blake-hamm/bhamm-lab.git
    targetRevision: main
    path: kubernetes/charts/common
    helm:
      valuesObject:
        name: hermes
        pvc:
          - name: hermes-data
            accessMode: ReadWriteMany
            storageClassName: csi-cephfs-sc
            storageSize: 10Gi
        k8up:
          backup:
            enabled: true
          restore:
            enabled: true
        externalSecrets:
          enabled: true
          secrets:
            - secretKey: OPENAI_API_KEY
              remoteRef:
                key: /default/litellm
                property: LITELLM_MASTER_KEY
            - secretKey: API_SERVER_KEY
              remoteRef:
                key: /default/hermes
                property: API_SERVER_KEY
        ingressRoutes:
          - name: hermes
            ingressClass: traefik-external
            websocket: true
            routes:
              - match: Host(`hermes.bhamm-lab.com`)
                kind: Rule
                middlewares:
                  - name: default-headers
                services:
                  - name: hermes
                    scheme: http
                    port: 9119
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
