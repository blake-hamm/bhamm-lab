apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hermes
  name: hermes
  namespace: hermes
  annotations:
    argocd.argoproj.io/sync-wave: "30" # after hindsight api is live (26/27)
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  # Never two gateway containers on the same /opt/data dir
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
      containers:
        - name: hermes
          # NOTE: image starts as root (s6-overlay PID 1); stage2-hook chowns
          # /opt/data then drops services to hermes (UID 10000) via s6-setuidgid.
          # Do NOT set runAsNonRoot / drop ALL caps — stage2 needs them.
          # Derived from nousresearch/hermes-agent:v0.23.0 by docker/hermes/Dockerfile,
          # which adds the hindsight plugin's python deps (they belong in this venv and
          # the pod overlay loses runtime installs). Built and pushed to :latest by
          # forgejo-docker-all on any docker/ change, so pull Always.
          # Bump the Dockerfile FROM by hand: upstream moved off date-stamped tags.
          image: harbor.bhamm-lab.com/library/hermes:latest
          imagePullPolicy: Always
          args:
            - gateway
            - run
          env:
            - name: OPENAI_BASE_URL
              value: "http://litellm.litellm.svc.cluster.local:4000/v1"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-external-secret
                  key: OPENAI_API_KEY
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-external-secret
                  key: API_SERVER_KEY
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: "0.0.0.0"
            - name: HERMES_DASHBOARD_OIDC_ISSUER
              value: "https://auth.bhamm-lab.com"
            - name: HERMES_DASHBOARD_OIDC_CLIENT_ID
              value: "hermes"
            - name: HERMES_DASHBOARD_PUBLIC_URL
              value: "https://hermes.bhamm-lab.com"
            # Web search backend (SearXNG plugin; covers all profiles in this
            # container — env is shared across the gateway processes).
            - name: SEARXNG_URL
              value: "http://searxng.searxng.svc.cluster.local:8080"
            # Web extract backend (self-hosted Firecrawl; keyless, in-cluster).
            - name: FIRECRAWL_API_URL
              value: "http://firecrawl-firecrawl-api.firecrawl.svc.cluster.local:3002"
            # Hindsight memory backend (in-cluster; tenant key sent as Bearer).
            # Plugin: `hermes plugins install hindsight`, activated per-profile
            # via `memory.provider: hindsight` — see docs ai/hindsight.md.
            - name: HINDSIGHT_MODE
              value: "local_external"
            - name: HINDSIGHT_API_URL
              value: "http://hindsight-api.hindsight.svc.cluster.local:8888"
            - name: HINDSIGHT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-external-secret
                  key: HINDSIGHT_API_KEY
            # Grafana service-account token for the forge agent's mcp-grafana
            # server (read-only, Viewer role). Optional until the token is
            # created in the Grafana UI and added to SOPS /core/monitor.
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-external-secret
                  key: GRAFANA_SERVICE_ACCOUNT_TOKEN
                  optional: true
            # CDP endpoint for browser_exec — points the browser-harness
            # daemon at the chromium-cdp sidecar (127.0.0.1:9222). Without
            # this, the daemon's liveness check (which only scans its own
            # profile dirs / known browser binary names) fails before it
            # ever reaches the port-9222 fallback probe.
            - name: BU_CDP_URL
              value: "http://127.0.0.1:9222"
          ports:
            - containerPort: 9119
              name: dashboard
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 9119
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9119
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - mountPath: /opt/data
              name: hermes-data
        # CDP endpoint for browser_exec (browser-use harness attaches via
        # 127.0.0.1:9222). The harness never launches a browser on its own
        # (bare launch opens no CDP port), so a browser must be listening.
        # The image ships Chrome for Testing and records its path in
        # /etc/hermes/chromium-executable-path — resolve it at start so this
        # sidecar does not need a per-image baked revision. Verified 2026-11-09
        # on v0.23.0: Chrome/145.0.7632.6 serves /json/version with --headless=new.
        # The disable-* flags only silence container noise (no dbus, GPU or Google
        # services here): Vulkan/dawn, GCM registration, component updates.
        - name: chromium-cdp
          image: harbor.bhamm-lab.com/library/hermes:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - exec "$(cat /etc/hermes/chromium-executable-path)" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-background-networking --disable-component-update --disable-sync --disable-features=Translate,MediaRouter --no-first-run --no-default-browser-check --remote-debugging-port=9222 --user-data-dir=/tmp/chromium-cdp
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      securityContext:
        # Must match the "hermes" account's GID (10000 in v0.23.0; it was 1000 in
        # v2026.9.x). Hermes refuses to start a turn when $HERMES_HOME is group-
        # writable by a group that is not its own: gateway_runtime_discovery raises
        # unsafe_control_permissions and the dashboard chat silently fails to reply.
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
      dnsPolicy: ClusterFirst
      restartPolicy: Always
