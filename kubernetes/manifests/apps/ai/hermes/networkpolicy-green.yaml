# Netpol for the hermes namespace. Cilium runs default enforcement mode
# (policies only apply where selected), so this scopes to hermes.
#
# NOTE: Cilium's DNS proxy does NOT populate FQDN state on this cluster
# (Envoy-external transparent proxy: 0 redirects, empty FQDN cache), so
# `toFQDNs` rules grant nothing in practice. Prefer explicit in-cluster
# selectors / service rules (here) or CIDRs. Telegram egress therefore uses
# world:443 for now; switch back to toFQDNs if the proxy is ever fixed.
#
# Default-deny is implicit: any CiliumNetworkPolicy selecting these endpoints
# flips Cilium to deny-by-default for all non-matching traffic. No separate
# empty default-deny CNP needed (an empty ingress+egress CNP is rejected as
# invalid by Cilium).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-ingress
  namespace: hermes
  annotations:
    argocd.argoproj.io/sync-wave: "23"
spec:
  endpointSelector: {}
  ingress:
    # Dashboard (9119) via traefik only
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "9119"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-egress
  namespace: hermes
  annotations:
    argocd.argoproj.io/sync-wave: "23"
spec:
  endpointSelector: {}
  egress:
    # DNS (kube-dns) — required for everything below
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API — Argo workflow executor (taskresult patches), kubectl
    # wait scripts, k8up job pods
    - toEntities:
        - kube-apiserver
    # Ceph RGW S3 (onsite backup target). external-rgw is a selector-less
    # Service with manual Endpoints to Proxmox hosts; Cilium KPR translates
    # ClusterIP:80 -> backend:7480 BEFORE egress policy enforcement, so the
    # policy must match the backend CIDR + targetPort (7480), not the
    # service port. toServices cannot match here.
    - toCIDR:
        - 10.0.20.11/32
        - 10.0.20.12/32
        - 10.0.20.13/32
      toPorts:
        - ports:
            - port: "7480"
              protocol: TCP
    # Prometheus pushgateway — k8up/restic backup stats
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitor
            k8s:app.kubernetes.io/name: prometheus-pushgateway
      toPorts:
        - ports:
            - port: "9091"
              protocol: TCP
    # LLM backend
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    # OIDC discovery / token exchange (Authelia via Traefik).
    # App connects BOTH to the Traefik LB VIP and directly to the Traefik
    # pod IPs (8443 = websecure), so cover both.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    - toServices:
        - k8sService:
            namespace: traefik
            serviceName: traefik
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Telegram long-polling + media (outbound only; bot handles TLS). FQDN
    # rules non-functional (see header note) — interim world:443 until DNS
    # proxy is fixed.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
