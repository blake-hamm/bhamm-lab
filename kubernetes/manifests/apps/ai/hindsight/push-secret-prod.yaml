# PushSecret: CNPG -> Vault -> ExternalSecret round-trip (issue #338).
#
# CNPG bootstraps the `hindsight` DB with a CNPG-generated password in the
# auto-managed `hindsight-postgresql-app` Secret (initdb owner from the common
# chart). That secret's key is `password`; the hindsight chart only accepts a
# Secret with key `postgres-password`, so we route through Vault:
#
#   hindsight-postgresql-app (CNPG cluster, inner wave 17)
#     -> PushSecret (this file) -> Vault secret/data/default/hindsight-db
#       -> common-chart ExternalSecret -> hindsight-external-secret
#         (key remap to `postgres-password`) -> hindsight chart existingSecret.
#
# Its OWN Vault path: the SOPS->Vault sync does `vault kv put`, which REPLACES
# the whole path — writing into /default/hindsight would get wiped by the next
# SOPS sync (and ESO tags paths it manages). No extra Vault ACL needed: the
# ESO store authenticates as the `default` k8s auth role, bound to the
# allow_secrets policy in base/vault/cr-all.yaml
# (secret/* -> create,read,update,delete,list — covers data + metadata paths
# KV v2 push writes). Same wave as the ES = eventual
# reconcile after provisioning (deliberate, Blake-approved).
#
# deletionPolicy stays default (None): tearing down the app must not wipe Vault.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: hindsight-cnpg-to-vault
  namespace: hindsight
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    # Synced by prod-apps (app-of-apps); wave orders it INSIDE prod-apps:
    # after namespace-prod.yaml (-1) and deliberately the SAME wave as the
    # hindsight-common Application, so the ES (rendered by that chart) and the
    # PushSecret appear together, right after litellm (24). The PushSecret
    # then waits — ESO retries until CNPG creates hindsight-postgresql-app,
    # then pushes. No chicken-and-egg.
    argocd.argoproj.io/sync-wave: "26"
spec:
  updatePolicy: Replace
  refreshInterval: 1h
  secretStoreRefs:
    - name: vault-backend
      kind: ClusterSecretStore
  selector:
    secret:
      name: hindsight-postgresql-app
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: /default/hindsight-db
          property: password
      # Explicit: the CRD defaults this to None server-side, and Argo diffs
      # the raw manifest against the defaulted live object -> perpetual
      # OutOfSync without it (ESO docs recommend declaring it explicitly).
      conversionStrategy: None
