apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "24"
spec:
  destination:
    namespace: litellm
    server: https://kubernetes.default.svc
  project: default
  source:
    # OCI chart repo: the BerriAI git monorepo removed
    # deploy/charts/litellm-helm after v1.92.0, so the git repoURL+path
    # source cannot serve >= v1.93.0. Chart version == app version.
    # Never retarget 1.107.0 (supply-chain compromise).
    repoURL: oci://ghcr.io/berriai/litellm-helm
    targetRevision: "1.108.0"
    helm:
      valuesObject:
        replicaCount: 1
        image:
          repository: harbor.bhamm-lab.com/library/litellm-custom
          pullPolicy: Always
          tag: "latest"
        deploymentAnnotations:
          reloader.stakater.com/auto: "true"
        masterkeySecretName: "litellm-external-secret"
        masterkeySecretKey: "LITELLM_MASTER_KEY"
        proxyConfigMap:
          name: litellm-config
          create: false
        # Working set hit ~78% of the 2Gi limit with 23 restarts/7d: trim the
        # cpu request, give memory real headroom.
        resources:
          requests:
            cpu: 250m
            memory: 1536Mi
          limits:
            cpu: 1
            memory: 3072Mi
        db:
          useExisting: true
          database: litellm
          url: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)
          secret:
            name: litellm-postgresql-app
            usernameKey: username
            passwordKey: password
            endpointKey: host
          deployStandalone: false
        envVars:
          REDIS_HOST: "litellm-dragonfly"
          REDIS_PORT: "6379"
          REDIS_PASSWORD: ""
          QDRANT_VECTOR_SIZE: 4096
          QDRANT_API_BASE: http://qdrant.qdrant.svc.cluster.local:6333
          MLFLOW_EXPERIMENT_NAME: "litellm"
          MLFLOW_TRACKING_URI: "http://llm-models-mlflow.models.svc.cluster.local:80"
          MLFLOW_REGISTRY_URI: "http://llm-models-mlflow.models.svc.cluster.local:80"
          MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE: "true"
          PHOENIX_PROJECT_NAME: "litellm"
          PHOENIX_COLLECTOR_ENDPOINT: "http://llm-models-phoenix-svc.models.svc.cluster.local:4317/v1/traces"
          PHOENIX_COLLECTOR_HTTP_ENDPOINT: "http://llm-models-phoenix-svc.models.svc.cluster.local:6006/v1/traces"
          PHOENIX_API_KEY: "no-auth"
        migrationJob:
          hooks:
            argocd:
              enabled: true
        extraEnvVars:
          - name: LITELLM_MASTER_KEY
            valueFrom:
              secretKeyRef:
                name: litellm-external-secret
                key: LITELLM_MASTER_KEY
          - name: LITELLM_SALT_KEY
            valueFrom:
              secretKeyRef:
                name: litellm-external-secret
                key: LITELLM_SALT_KEY
          - name: QDRANT_API_KEY
            valueFrom:
              secretKeyRef:
                name: litellm-external-secret
                key: QDRANT_API_KEY
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
