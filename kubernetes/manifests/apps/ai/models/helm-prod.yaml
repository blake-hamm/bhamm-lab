          - name: deepseek-v4-flash
            # DeepSeek V4 Flash via gufo (open-source, MIT; Strix-Halo-specific) on the
            # TAIL node, co-located with gemma-4-26b. Both scale to zero when idle
            # (ElastiService), so they don't hold the single GPU / 128 GiB simultaneously.
            #
            # Single-node gufo beats the two-node ds4/DwarfStar pipeline on every axis
            # (prefill 484 vs ~430 tok/s, decode 16.3 vs 14-15 tok/s, load 16.4s vs
            # 150.9s, 93 GiB vs 163 GiB resident) — gufo streams the engram tables from
            # SSD instead of splitting layers across a second node.
            #
            # Model: antirez/deepseek-v4-gguf 0731 IQ2XXS (86.7 GiB) + DSpark support
            # model (6 GiB) for speculative decoding.
            #
            # Scale-to-zero: same generated-token-rate trigger as qwen-38-flash.
            description: DeepSeek V4 Flash via gufo on Strix Halo (tail)
            enabled: true
            hostIPC: true
            pvc:
              storage: "150Gi"
            image:
              repository: ghcr.io/gufo-org/toolboxes/gufo-runtime
              tag: latest
            nodeSelector:
              kubernetes.io/hostname: prod-talos-worker-tail
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            command:
              - /bin/gufo
            args:
              - serve
              - llm
              - --model
              - /models/cache/deepseek-v4-flash/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf
              - --dspark-model
              - /models/cache/deepseek-v4-flash/DeepSeek-V4-Flash-DSpark-support-0731.gguf
              - --sessions
              - "1"
              - --context
              - "32768"
              - --host
              - 0.0.0.0
              - --port
              - "8080"
            initContainers:
              - name: setup
                # python:3.12-slim (Debian) ships a proper CA store, so TLS verification
                # just works (the gufo-runtime Nix image's curl can't locate its CA
                # bundle). Installs the `hf` CLI (huggingface_hub) and downloads the
                # model to the /models/cache mount. Idempotent: skips if already present.
                image: python:3.12-slim
                command:
                  - /bin/bash
                  - -lc
                  - |
                    set -euo pipefail
                    pip install -q --no-cache-dir huggingface_hub
                    D=/models/cache/deepseek-v4-flash
                    mkdir -p "$D"
                    if [ -s "$D/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf" ]; then
                      echo "[setup] model already present in $D"
                    else
                      echo "[setup] downloading DeepSeek-V4-Flash 0731 IQ2XXS + DSpark (~93 GiB)"
                      hf download antirez/deepseek-v4-gguf \
                        --include 'DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf' \
                        --include 'DeepSeek-V4-Flash-DSpark-support-0731.gguf' \
                        --local-dir "$D"
                    fi
                    echo "[setup] done"
                volumeMounts:
                  - name: model-cache
                    mountPath: /models/cache
            zeroscaling:
              enabled: true
              minReplicas: 1
              cooldownPeriod: 1800
              trigger:
                query: >-
                  rate(llamacpp:tokens_predicted_total{container="deepseek-v4-flash"}[5m]) > 0.001 or vector(0)
                threshold: "0"
            resources:
              limits:
                amd.com/gpu: 1
                memory: "100Gi"
                cpu: "8"
              requests:
                amd.com/gpu: 1
                cpu: "4"
                memory: "90Gi"
