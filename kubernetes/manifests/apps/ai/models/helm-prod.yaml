apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-models
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "18"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: models
  source:
    repoURL: https://github.com/blake-hamm/kube-ai-stack.git
    # TEMP (litellm-titler alias): points at the chart feature branch that adds
    # global.litellm.extraModels; flip back to main after the chart PR merges.
    targetRevision: feature/litellm-extra-models
    path: charts/kube-ai-stack
    helm:
      valuesObject:
        global:
          prometheusUrl: "http://monitor-prometheus.monitor.svc.cluster.local:9090"
          mlflow:
            enabled: true
          phoenix:
            enabled: true
          litellm:
            manage_config: true
            # Alias route for Hermes session titling: halogen rejects
            # response_format json_schema unless temperature 0 is explicit
            # (sampling-under-schema is unimplemented server-side). This alias
            # pins temperature 0 on the same halogen backend so hermes' title
            # calls keep strict JSON output with zero 400s. Selected per-task
            # via auxiliary.title_generation.model in the hermes profile configs.
            extraModels:
              - model_name: qwen-38-flash-halogen-titler
                litellm_params:
                  model: openai/qwen-38-flash-halogen
                  api_base: http://qwen-38-flash-halogen.models.svc.cluster.local:8080/v1
                  api_key: "dummy"
                  temperature: 0
            config:
              litellm_settings:
                request_timeout: 1800
                drop_params: true
                modify_params: True
                cache: False
                cache_params:
                  type: qdrant-semantic
                  qdrant_semantic_cache_embedding_model: qwen-embed
                  qdrant_collection_name: litellm
                  similarity_threshold: 0.6
                callbacks: ["arize_phoenix"]
                success_callback: ["mlflow"]
                failure_callback: ["mlflow"]
              general_settings:
                enforce_user_param: False
                store_model_in_db: True
                store_prompts_in_spend_logs: True
                health_check_interval: 1800
              router_settings:
                debug_level: "INFO"
                allowed_fails: 999
                timeout: 1800
                num_retries: 0
                routing_strategy: simple-shuffle
                redis_host: os.environ/REDIS_HOST
                redis_port: os.environ/REDIS_PORT
                redis_password: os.environ/REDIS_PASSWORD
              search_tools:
                - search_tool_name: searxng-search
                  litellm_params:
                    search_provider: searxng
                    api_base: http://searxng.searxng.svc.cluster.local:8080
        mlflow:
          image:
            repository: ghcr.io/mlflow/mlflow
            pullPolicy: IfNotPresent
            tag: "v3.10.1-full"
          initImages:
            mlflowDbMigration:
              repository: ghcr.io/mlflow/mlflow
              pullPolicy: IfNotPresent
              tag: "v3.10.1-full"
          backendStore:
            databaseMigration: true
            databaseConnectionCheck: true
            postgres:
              enabled: true
              host: "models-postgresql-rw"
              port: 5432
              database: "mlflow"
            existingDatabaseSecret:
              name: "models-postgresql-app"
              usernameKey: "username"
              passwordKey: "password"
          artifactRoot:
            proxiedArtifactStorage: true
            s3:
              enabled: true
              bucket: mlflow
              existingSecret:
                name: "models-external-secret"
                keyOfAccessKeyId: "s3_access_key"
                keyOfSecretAccessKey: "s3_secret_key"
          extraEnvVars:
            MLFLOW_S3_ENDPOINT_URL: http://external-rgw.ceph.svc.cluster.local:80
            MLFLOW_S3_IGNORE_TLS: "true"
            MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE: "true"
          extraFlags:
            - serveArtifacts
          serviceMonitor:
            enabled: true
            namespace: models
          extraVolumes:
            - name: prometheus-dir
              emptyDir: {}
          extraVolumeMounts:
            - name: prometheus-dir
              mountPath: /mlflow
        phoenix-helm:
          healthChecks:
            startupProbe:
              periodSeconds: 5
              failureThreshold: 60
          ingress:
            enabled: false
          postgresql:
            enabled: false
          persistence:
            enabled: false
          server:
            telemetryEnabled: false
          service:
            type: "ClusterIP"
          auth:
            enableAuth: false
            createSecret: false
            secret: []
          additionalEnv:
            - name: PHOENIX_POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: models-postgresql-app
                  key: host
            - name: PHOENIX_POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: models-postgresql-app
                  key: port
            - name: PHOENIX_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: models-postgresql-app
                  key: user
            - name: PHOENIX_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: models-postgresql-app
                  key: password
            - name: PHOENIX_POSTGRES_DB
              value: "phoenix"
        models:
          - name: qwen-embed
            description: Qwen3-Embedding-8B on Arc Pro B70 (Intel LLM-Scaler vLLM, XPU) — migrated off the r9700 llama.cpp backend
            enabled: true
            hostIPC: true
            pvc:
              storage: "30Gi"
            image:
              repository: intel/llm-scaler-vllm
              tag: 0.26.0-b2
            nodeSelector:
              kubernetes.io/hostname: prod-talos-worker-intel-b70
            tolerations:
              - key: "intel.com/gpu"
                operator: "Exists"
                effect: "NoSchedule"
            hfToken:
              enabled: true
              secretName: models-external-secret
              secretKey: hf_token
            initContainers:
              - name: setup
                image: intel/llm-scaler-vllm:0.26.0-b2
                command:
                  - /bin/bash
                  - -lc
                  - |
                    set -euo pipefail
                    SNAP=/models/cache/Qwen3-Embedding-8B
                    AVAIL_GB=$(df -BG --output=avail /models/cache | tail -1 | tr -dc '0-9')
                    if [ ! -f "$SNAP/config.json" ] && [ "$AVAIL_GB" -lt 20 ]; then
                      echo "[setup] only ${AVAIL_GB}GiB free on the model PVC; the embedding checkpoint"
                      echo "[setup] download wants ~16GiB. Free space or grow the user volume, then restart."
                      exit 1
                    fi
                    # Guard on weight shards, NOT config.json: config.json lands
                    # first during snapshot_download, so an interrupted download
                    # leaves a dir that passes a config.json check but has no
                    # weights (vLLM: "Cannot find any model weights").
                    # snapshot_download is idempotent and resumes a partial tree.
                    if ! ls "$SNAP"/*.safetensors >/dev/null 2>&1; then
                      echo "[setup] downloading Qwen/Qwen3-Embedding-8B (~16 GiB)"
                      python3 -c 'from huggingface_hub import snapshot_download; snapshot_download("Qwen/Qwen3-Embedding-8B", local_dir="/models/cache/Qwen3-Embedding-8B")'
                    else
                      echo "[setup] checkpoint exists: $SNAP"
                    fi
                env:
                  - name: HF_HOME
                    value: /models/cache/huggingface
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: models-external-secret
                        key: hf_token
                volumeMounts:
                  - name: model-cache
                    mountPath: /models/cache
            command:
              - vllm
              - serve
            args:
              - /models/cache/Qwen3-Embedding-8B
              - --served-model-name
              - qwen-embed
              - --runner
              - pooling
              - --host
              - 0.0.0.0
              - --port
              - "8080"
              - --max-model-len
              - "8192"
              - --dtype
              - float16
              - --trust-remote-code
            env:
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NO_USAGE_STATS
                value: "1"
              - name: VLLM_WORKER_MULTIPROC_METHOD
                value: spawn
              - name: ZES_ENABLE_SYSMAN
                value: "1"
              - name: ONEAPI_DEVICE_SELECTOR
                value: level_zero:0
              - name: VLLM_CACHE_ROOT
                value: /models/cache/vllm
              - name: HF_HUB_OFFLINE
                value: "1"
            zeroscaling:
              enabled: true
              minReplicas: 1
              cooldownPeriod: 1800
              trigger:
                query: >-
                  sum(vllm:num_requests_running{container="qwen-embed"}) or vector(0)
                threshold: "1"
            resources:
              limits:
                gpu.intel.com/xe: 1
                memory: "24Gi"
                cpu: "8"
              requests:
                gpu.intel.com/xe: 1
                cpu: "4"
                memory: "20Gi"
          - name: gpt-oss-120b
            description: Great reasoning MoE model for general chat queries
            enabled: false
            pvc:
              storage: "80Gi"
            image:
              tag: rocm-7.14_20260818T163752
            args:
              - llama-server
              - -hf
              - gghfez/gpt-oss-120b-Derestricted.MXFP4_MOE-gguf
              - --host
              - 0.0.0.0
              - --metrics
              - --no-webui
              - --jinja
              - --timeout
              - "1800"
              - -v
              - -ngl
              - "999"
              - -fa
              - "on"
              - -c
              - "65536"
              - --parallel
              - "2"
              - --cont-batching
              - --temp
              - "1.0"
              - --min-p
              - "0.0"
              - --top-p
              - "1.0"
              - --top-k
              - "0.0"
            resources:
              limits:
                amd.com/gpu: 1
                memory: "120Gi"
                cpu: "8"
              requests:
                amd.com/gpu: 1
                cpu: "4"
                memory: "110Gi"
          - name: qwen
            description: High quality dense model
            enabled: false
            pvc:
              storage: "40Gi"
            args:
              - llama-server
              - -hf
              - ggml-org/Qwen3-32B-GGUF:F16
              - --host
              - 0.0.0.0
              - --metrics
              - --no-webui
              - --jinja
              - --timeout
              - "1800"
              - -v
              - -ngl
              - "999"
              - -fa
              - "on"
              - -c
              - "65536"
              - --parallel
              - "2"
              - --cont-batching
              - --temp
              - "0.7"
              - --min-p
              - "0.00"
              - --top-p
              - "0.8"
              - --top-k
              - "20"
              - --presence-penalty
              - "1.5"
            resources:
              limits:
                amd.com/gpu: 1
                memory: "120Gi"
                cpu: "8"
              requests:
                amd.com/gpu: 1
                cpu: "4"
                memory: "110Gi"
          - name: qwen-36-a3b
            description: High quality MoE model for general chat
            enabled: true
            pvc:
              storage: "40Gi"
            image:
              tag: rocm-10.0_20260925T042242
            args:
              - llama-server
              - -hf
              - unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q8_K_XL
              - --host
              - 0.0.0.0
              - --metrics
              - --no-webui
              - --jinja
              - --timeout
              - "1800"
              - -v
              - --no-warmup
              - -ngl
              - "999"
              - -fa
              - "on"
              - --spec-type
              - draft-mtp
              - --spec-draft-n-max
              - "2"
              - --load-mode
              - dio
              - -ctk
              - q8_0
              - -ctv
              - q8_0
              - -c
              - "1048576"
              - --parallel
              - "4"
              - --cont-batching
              - --reasoning-budget
              - "2048"
              - --reasoning-budget-message
              - "Due to time constraints, I need to give my answer now."
              - --chat-template-kwargs
              - '{"preserve_thinking":true}'
              - --temp
              - "0.8"
              - --min-p
              - "0.00"
              - --top-p
              - "0.95"
              - --top-k
              - "20"
              - --presence-penalty
              - "1.5"
            resources:
              limits:
                amd.com/gpu: 1
                memory: "100Gi"
                cpu: "8"
              requests:
                amd.com/gpu: 1
                cpu: "4"
                memory: "80Gi"
            nodeSelector:
              kubernetes.io/hostname: prod-talos-worker-nose
          - name: qwen-38-flash
            # DEPRECATED (2026-09-29): replaced by qwen-38-flash-halogen.
            # A/B test via litellm showed halogen wins the agentic profile:
            # 262K prefill 80s vs 162s, flat ~3.6s prompt-cache follow-up
            # turns, 42 GB vs 96 GB VRAM, uniform 4-stream parallel decode.
            # Disabled here (halogen is now primary); the entry is kept for
            # a quick re-enable if needed.
            #
            # Qwen 3.8 Flash-Next via gufo (open-source, MIT; Strix-Halo-specific) on the
            # nose node. Replaces the closed-source halogen-flash-server entry: gufo is
            # ~2.2x faster prefill (1628 vs 752 tok/s @32k) and +45% decode (59.4 vs 41
            # tok/s) on the same UD-Q4_K_XL model, and it has no kernel>=7.0 requirement
            # (the halogen blocker on Talos 6.18 goes away).
            #
            # Model: unsloth/Qwen3.8-Flash-Next-GGUF UD-Q4_K_XL (4 shards, ~113 GiB) +
            # shared-Q8 MTP predictor (2.8 GiB) + BF16 vision projector (0.9 GiB).
            # initContainer pre-downloads via curl (the gufo-runtime image ships curl,
            # no hf CLI) so the main container starts from a warm disk.
            #
            # Scale-to-zero: gufo's /metrics is unauthenticated when no --api-key is set,
            # and it exports llama.cpp-prefixed counters. We trigger on the generated-token
            # rate (per the agreed interim approach; a connection-counting sidecar or a
            # metrics-rich gateway can replace this later).
            description: Qwen 3.8 Flash-Next via gufo on Strix Halo (nose)
            enabled: false
            hostIPC: true
            pvc:
              storage: "150Gi"
            image:
              repository: ghcr.io/gufo-org/toolboxes/gufo-runtime
              # Pinned release (digest matches the `latest` tag at pin time).
              # Upstream switched from daily timestamp tags to release-please
              # semver tags (vX.Y.Z -> version + series + latest). 0.1.1 is the
              # first build containing gufo#283 (constrained JSON Schema
              # output), which fixes the response_format 400 Hermes' session
              # titler was hitting. Bump deliberately.
              tag: 0.1.1
            nodeSelector:
              kubernetes.io/hostname: prod-talos-worker-nose
            # ROCm GPU memory mapping locks (mlock) host memory. The gufo quickstart uses
            # --ulimit memlock=-1; the K8s container-level equivalent is CAP_IPC_LOCK,
            # which lets the process bypass the RLIMIT_MEMLOCK limit. (ulimits is a
            # pod-level field and is not valid in a container securityContext.)
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            command:
              - /bin/gufo
            args:
              - serve
              - llm
              - --model
              - /models/cache/qwen38-flash-next/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
              - --served-model-name
              - qwen-38-flash
              - --speculative
              - mtp
              - --mtp-model
              - /models/cache/qwen38-flash-next/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf
              - --mmproj
              - /models/cache/qwen38-flash-next/mmproj-BF16.gguf
              - --sessions
              - "2"
              - --context
              - "262144"
              - --cache-disk
              - /models/cache/gufo-disk-cache
              # KV snapshots for ~100k-token prompts are ~3 GiB; the default
              # staging buffer (auto: min(1 GiB, 1/8 avail RAM)) silently
              # skips them, so long chats re-prefill from zero every turn.
              # 4 GiB covers observed snapshots (up to ~3.1 GiB).
              - --cache-disk-staging-bytes
              - "4294967296"
              # Disk cache capacity (default 8 GiB). At 8 GiB the cache churns:
              # retained_bytes pinned at 7.2-8.5 GiB, hot snapshots evicted and
              # re-saved within minutes (~50 GB written per 13 min window).
              # 20 GiB fits the physical disk (173 GB free on the 2TB local-path
              # volume on nose) alongside the ~116 GiB of model files; the PVC
              # claim is unenforced by local-path-provisioner.
              - --cache-disk-bytes
              - "21474836480"
              - --host
              - 0.0.0.0
              - --port
              - "8080"
            initContainers:
              - name: setup
                # python:3.12-slim (Debian) ships a proper CA store, so TLS verification
                # just works (the gufo-runtime Nix image's curl can't locate its CA
                # bundle). Installs the `hf` CLI (huggingface_hub) and downloads the
                # model to the /models/cache mount. Idempotent: skips if already present.
                image: python:3.12-slim
                env:
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: models-external-secret
                        key: hf_token
                  - name: HF_HUB_ENABLE_HF_TRANSFER
                    value: "1"
                command:
                  - /bin/bash
                  - -lc
                  - |
                    set -euo pipefail
                    pip install -q --no-cache-dir --root-user-action=ignore huggingface_hub hf_transfer
                    D=/models/cache/qwen38-flash-next
                    mkdir -p "$D"
                    # hf download is natively idempotent: it skips already-complete
                    # files and resumes missing/partial ones (writes to a .incomplete
                    # temp, renames on completion). No manual guard needed — this
                    # survives a pod that was killed mid-download.
                    echo "[setup] downloading Qwen3.8-Flash-Next UD-Q4_K_XL + MTP + mmproj (~116 GiB)"
                    hf download unsloth/Qwen3.8-Flash-Next-GGUF \
                      --include 'UD-Q4_K_XL/*.gguf' \
                      --include 'MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf' \
                      --include 'mmproj-BF16.gguf' \
                      --max-workers 8 \
                      --local-dir "$D"
                    echo "[setup] done"
                volumeMounts:
                  - name: model-cache
                    mountPath: /models/cache
            zeroscaling:
              enabled: true
              minReplicas: 1
              cooldownPeriod: 1800
              trigger:
                # Single-series busy/idle signal: sum() keeps the scaler from
                # erroring on multi-series results; `or vector(0)` covers the
                # at-zero state where the series is gone. KubeElasti compares
                # the RAW value against threshold (value < threshold → scale to
                # zero), so the idle boundary lives in threshold, NOT in a `>`
                # filter inside the query (that returned the raw rate, making
                # anything under 1 tok/s look idle against threshold "1").
                query: >-
                  sum(rate(llamacpp:tokens_predicted_total{container="qwen-38-flash"}[5m])) or vector(0)
                threshold: "0.001"
            resources:
              limits:
                amd.com/gpu: 1
                memory: "124Gi"
                cpu: "8"
              requests:
                amd.com/gpu: 1
                cpu: "4"
                memory: "122Gi"
          - name: qwen-38-flash-halogen
            # EXPERIMENTAL: Qwen 3.8 Flash-Next via halogen-flash-server on the
            # tail node, to A/B against gufo (qwen-38-flash on nose) on agentic
            # long-context workloads. Halogen's edge is decode at depth (~45
            # tok/s at 258K vs gufo ~28) and its resume-anywhere prompt cache
            # (follow-up turns ~2s regardless of conversation size); prefill is
            # at parity. Serves the model's full native 262,144-token context.
            #
            # PREREQUISITES on tail (both are manual, see PR):
            #   1. Kernel >= 7.0. The checkpoint is a read-only file mapping
            #      registered with the GPU; on 6.18.x the driver refuses it with
            #      `invalid argument` (halogen issue #37). Talos 1.12.6 ships
            #      6.18.x, so this will NOT run on the current green-cluster
            #      kernel — it needs a node booted on 7.0+.
            #   2. BIOS UMA carve-out at its explicit MINIMUM (opposite of
            #      gufo, which wants it maxed). Halogen drives the GPU through
            #      GTT and needs the carved-out RAM back for the page cache.
            #
            # Model: the engine's native v2 checkpoint (peonist-ai/halogen-
            # qwen3.8-flash-next: v2.hgn 62.1 GiB, one file, draft head
            # embedded + ngram.hgn 47.7 GiB lookup table + tokenizer).
            # v2 is the 0.15.0 default: closer to the base model's outputs
            # than w4b+overlay and ~3.5 GiB less resident memory.
            # initContainer pre-downloads via hf (idempotent/resumable) so the
            # engine starts from a warm disk; HALOGEN_DOWNLOAD stays unset (the
            # container then opens no outbound connections at all).
            #
            # Vision tower is intentionally OFF: on a 128 GB box its ~2 GiB is
            # the difference between the 524,288-position KV pool (two full
            # 262K conversations resident) and 262,144 (one). Flip
            # HALOGEN_VISION_TOWER=1 to trade the second resident conversation
            # back for image input.
            #
            # Memory (upstream-measured, 128 GB): ~64 GiB pinned weights +
            # 14.4 GiB pool + 21.3 GiB working memory (MAX_TOK 32768) ~= 100
            # GiB, leaving ~15 GiB page cache for the 47.7 GiB n-gram lookup
            # table (streamed from disk, never resident). Concurrency: 4 slots
            # (default) sharing the pool = two full 262K conversations resident
            # or four at 131K; four fully-resident 262K sessions do NOT fit on
            # 128 GB. Scale-to-zero uses halogen's /metrics, which exports the
            # llama.cpp-compatible counters.
            description: Qwen 3.8 Flash-Next via halogen on Strix Halo (tail, experimental)
            enabled: true
            hostIPC: true
            pvc:
              storage: "200Gi"
            image:
              repository: ghcr.io/peonist-ai/halogen-flash-server
              # Pinned deliberately (upstream's own guidance). 0.15.0 makes
              # the v2 checkpoint the default (single file, embedded draft
              # head, ~3.5 GiB less memory than w4b+overlay).
              tag: 0.15.0
            nodeSelector:
              kubernetes.io/hostname: prod-talos-worker-tail
            # Halogen pins the checkpoint into GPU-registered memory; the K8s
            # equivalent of --ulimit memlock=-1 is CAP_IPC_LOCK (same as the
            # gufo entry).
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            command:
              - /usr/local/bin/entrypoint.sh
            args:
              # Single-container mode: engine + OpenAI API in one pod (the
              # split compose topology isn't needed here).
              - all
            env:
              - name: HALOGEN_CHECKPOINT
                value: /models/cache/halogen/qwen38-flash-next-v2.hgn
              - name: HALOGEN_TOKENIZER
                value: /models/cache/halogen/tokenizer
              # Publish the API on the chart's standard port (service, probes
              # and the LiteLLM api_base all assume 8080). The engine's own
              # port 8730 stays unpublished inside the container.
              - name: HALOGEN_API_PORT
                value: "8080"
              # Two full 262K conversations resident (or four at 131K). This
              # is also the image default; pinned so an upstream default
              # change can't silently halve it.
              - name: HALOGEN_KV_POOL_POSITIONS
                value: "524288"
              # Disk prompt cache: conversations resume across pod restarts
              # instead of cold-prefilling (~40s saved on a 32K conversation).
              # Needs a real filesystem with direct I/O (local-path on the user
              # disk qualifies; tmpfs/overlay would be refused with a log line).
              - name: HALOGEN_CACHE_DIR
                value: /models/cache/halogen-prompt-cache
              - name: HALOGEN_CACHE_DISK_GIB
                value: "48"
              # Model-card thinking-mode sampling defaults so agent clients
              # that send no sampling fields behave like they do against gufo
              # (halogen decodes greedy otherwise).
              - name: HALOGEN_TEMPERATURE
                value: "1.0"
              - name: HALOGEN_TOP_P
                value: "0.95"
              - name: HALOGEN_TOP_K
                value: "20"
              # Output-budget fixes for Hermes context compression (see PR
              # comment): Hermes' compression summary deliberately sends no
              # max_tokens (a hard client cap truncates partial summaries),
              # so it ran under halogen's 8192 default while thinking (the
              # template's xhigh) ate part of it — finish_reason=length,
              # rejected partial summary, escalating cooldowns. Main agent
              # turns are unaffected: they send an explicit budget and a
              # request that sends one always wins.
              # - 32768 budget for budget-less requests (under the 65536 cap):
              #   covers Hermes' max summary size (~9.2K) plus a full 8K
              #   thinking run without overflow.
              # - 8192 thinking cap on requests that send no thinking control,
              #   so the budget reaches the summary text instead of being
              #   consumed by xhigh reasoning; also bounds the decode stall
