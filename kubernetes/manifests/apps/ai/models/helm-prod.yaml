              enabled: true
              minReplicas: 1
              # Short cooldown (120s vs the coordinator's 1800s): the worker is
              # only useful while the coordinator is up. When the coordinator
              # scales to zero the worker has no tensor-parallel peer and is
              # dead weight, so it should scale down quickly rather than sit
              # idle for 30 min. The coordinator keeps the long cooldown to
              # avoid flapping on transient request dips.
              cooldownPeriod: 120
