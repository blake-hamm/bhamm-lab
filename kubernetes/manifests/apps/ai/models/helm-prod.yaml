          - name: deepseek-41-flash
            # DeepSeek V4.1 Flash via ds4 (DwarfStar, antirez) on the NOSE node,
            # two-node tensor-parallel with a worker on the TAIL node (mirrors the
            # minimax m2.7 coordinator/worker pattern). Replaces the single-node
            # gufo deepseek-v4-flash entry: V4.1 is a ~748B MoE+Engram model that
            # does not fit in one 128 GiB Strix Halo, so it runs distributed.
            #
            # Container: kyuz0/strix-halo-ds4-toolbox:ds4.1f-rocm10.0 (ROCm 10.0,
            # gfx1151, tracks antirez/ds4:main). Ships ds4-server (coordinator) and
            # ds4 (worker). The gufo runtime CANNOT run V4.1 (stripped ds4 port, no
            # deepseek41 arch / no SSD streaming / no tensor-parallel).
            #
            # Model: antirez/deepseek-v4.1-flash-gguf DeepSeek-V4.1-Flash-Q2.gguf
            # (340.6 GiB) + DeepSeek-V4.1-Flash-Vision.gguf (0.9 GiB). Both nodes
            # pre-download the full GGUF (initContainer, hf_transfer).
            #
            # Scale-to-zero: ds4-server has NO /metrics endpoint, so a metrics
            # sidecar on the coordinator counts active API connections and exports
            # a Prometheus gauge. The worker follows the coordinator's replicas
            # (mirrors rpc-tail following minimax-m27).
            description: DeepSeek V4.1 Flash coordinator (ds4, nose) + worker (tail)
            enabled: true
            hostNetwork: true
            hostIPC: true
            pvc:
              storage: "400Gi"
            image:
              repository: docker.io/kyuz0/strix-halo-ds4-toolbox
              tag: ds4.1f-rocm10.0
            nodeSelector:
              kubernetes.io/hostname: prod-talos-worker-nose
            # ROCm GPU memory mapping locks (mlock) host memory. CAP_IPC_LOCK lets
            # the process bypass the RLIMIT_MEMLOCK limit.
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            command:
              - ds4-server
            args:
              - --rocm
              - -m
              - /models/cache/deepseek-41-flash/DeepSeek-V4.1-Flash-Q2.gguf
              - --vision
              - /models/cache/deepseek-41-flash/DeepSeek-V4.1-Flash-Vision.gguf
              - --ctx
              - "262144"
              - --tensor-parallel
              - --role
              - coordinator
              - --listen
              - 10.30.0.78
              - "9911"
              - --transport
              - tcp
              - --batched-session
              - "2"
              - --host
              - 0.0.0.0
              - --port
              - "8080"
            probes:
              enabled: true
              # ds4-server exposes no /health endpoint (OpenAI-style API only),
              # so the chart's default /health:8080 probes would 404 and kill
              # the pod. Use the per-model probe override (kube-ai-stack #72)
              # to probe the real surface: GET /v1/models.
              spec:
                startupProbe:
                  httpGet:
                    path: /v1/models
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 240
                readinessProbe:
                  httpGet:
                    path: /v1/models
                    port: 8080
                  periodSeconds: 30
                livenessProbe:
                  httpGet:
                    path: /v1/models
                    port: 8080
                  periodSeconds: 120
                  failureThreshold: 15
            sidecars:
              - name: metrics
                # ds4-server exposes no /metrics. This sidecar counts active
                # connections to the coordinator's API (127.0.0.1:8080) and
                # exports a Prometheus gauge for the scale-to-zero trigger.
                image:
                  repository: python
                  tag: "3.12-slim"
                command:
                  - /bin/bash
                  - -lc
                args:
                  - |
                    set -euo pipefail
                    python3 - <<'PY'
                    import time, threading
                    from http.server import BaseHTTPRequestHandler, HTTPServer

                    active = 0
                    lock = threading.Lock()

                    def count_active():
                        # Count ESTABLISHED TCP connections to the coordinator
                        # API on :8080 — a real, bounded gauge of in-flight
                        # requests (0 when idle, N when N clients connected).
                        # Reads the kernel socket table directly; no deps.
                        count = 0
                        for path in ("/proc/net/tcp", "/proc/net/tcp6"):
                            try:
                                with open(path) as f:
                                    next(f)  # skip header row
                                    for line in f:
                                        parts = line.split()
                                        if len(parts) < 4:
                                            continue
                                        if parts[3] != "01":  # 01 == ESTABLISHED
                                            continue
                                        lport = int(parts[1].rsplit(":", 1)[1], 16)
                                        if lport == 8080:
                                            count += 1
                            except Exception:
                                pass
                        return count

                    class H(BaseHTTPRequestHandler):
                        def do_GET(self):
                            if self.path == "/metrics":
                                with lock:
                                    n = active
                                body = (
                                    "# HELP ds4_active_requests Active API connections to coordinator :8080\n"
                                    "# TYPE ds4_active_requests gauge\n"
                                    "ds4_active_requests " + str(n) + "\n"
                                ).encode()
                                self.send_response(200)
                                self.send_header("Content-Type", "text/plain; version=0.0.4")
                                self.end_headers()
                                self.wfile.write(body)
                            else:
                                self.send_response(404)
                                self.end_headers()
                        def log_message(self, *a):
                            pass

                    def poll():
                        global active
                        while True:
                            with lock:
                                active = count_active()
                            time.sleep(5)

                    threading.Thread(target=poll, daemon=True).start()
                    HTTPServer(("0.0.0.0", 9102), H).serve_forever()
                    PY
                ports:
                  - name: metrics
                    containerPort: 9102
                resources:
                  limits:
                    memory: "512Mi"
                    cpu: "1"
                  requests:
                    memory: "128Mi"
                    cpu: "0.1"
            initContainers:
              - name: setup
                image: python:3.12-slim
                env:
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: models-external-secret
                        key: hf_token
                  - name: HF_HUB_ENABLE_HF_TRANSFER
                    value: "1"
                command:
                  - /bin/bash
                  - -lc
                  - |
                    set -euo pipefail
                    pip install -q --no-cache-dir --root-user-action=ignore huggingface_hub hf_transfer
                    D=/models/cache/deepseek-41-flash
                    mkdir -p "$D"
                    # hf download is natively idempotent: skips complete
                    # files, resumes partial ones (writes .incomplete temp,
                    # renames on completion). hf_transfer parallelizes the single
                    # 340.6 GiB file across connections.
                    echo "[setup] downloading DeepSeek-V4.1-Flash Q2 + Vision (~341 GiB)"
                    hf download antirez/deepseek-v4.1-flash-gguf \
                      --include 'DeepSeek-V4.1-Flash-Q2.gguf' \
                      --include 'DeepSeek-V4.1-Flash-Vision.gguf' \
                      --max-workers 8 \
                      --local-dir "$D"
                    echo "[setup] done"
                volumeMounts:
                  - name: model-cache
                    mountPath: /models/cache
            zeroscaling:
              enabled: true
              minReplicas: 1
              cooldownPeriod: 1800
              trigger:
                query: >-
                  sum(ds4_active_requests{service="deepseek-41-flash"}) or vector(0)
                threshold: "1"
            resources:
              limits:
                amd.com/gpu: 1
                memory: "124Gi"
                cpu: "8"
              requests:
                amd.com/gpu: 1
                cpu: "4"
                memory: "122Gi"
          - name: deepseek-41-flash-worker
            # DeepSeek V4.1 Flash worker (tail node). Pairs with the
            # deepseek-41-flash coordinator on the nose node. Runs ds4-server in
            # worker role; connects to the coordinator over the USB4 mesh
            # (10.30.0.78:9911). hostNetwork so the worker can reach the
            # coordinator over the USB4 interface (the pod network is not routable
            # from the USB4 link - same reason the minimax rpc worker uses
            # hostNetwork).
            #
            # Scale-to-zero follows the coordinator (mirrors rpc-tail following
            # minimax-m27): when the coordinator scales to zero, the worker does
            # too; when the coordinator scales up, the worker follows.
            description: DeepSeek V4.1 Flash worker (ds4, tail)
            enabled: true
            hostNetwork: true
            hostIPC: true
            pvc:
              storage: "400Gi"
            image:
              repository: docker.io/kyuz0/strix-halo-ds4-toolbox
              tag: ds4.1f-rocm10.0
            nodeSelector:
              kubernetes.io/hostname: prod-talos-worker-tail
            securityContext:
              capabilities:
                add:
                  - IPC_LOCK
            command:
              - ds4
            args:
              - --rocm
              - -m
              - /models/cache/deepseek-41-flash/DeepSeek-V4.1-Flash-Q2.gguf
              - --vision
              - /models/cache/deepseek-41-flash/DeepSeek-V4.1-Flash-Vision.gguf
              - --ctx
              - "262144"
              - --tensor-parallel
              - --role
              - worker
              - --coordinator
              - 10.30.0.78
              - "9911"
              - --transport
              - tcp
            probes:
              enabled: true
              # The worker (ds4 binary) has no HTTP server at all - only the
              # tensor-parallel RPC to the coordinator - so the chart's default
              # /health:8080 probes would connection-refuse and kill the pod.
              # Use the per-model probe override (kube-ai-stack #72) with an
              # exec probe. Liveness only (no startup/readiness): the worker
              # is a peer of the coordinator, not an independently-routable
              # endpoint, so readiness has no meaning here.
              spec:
                livenessProbe:
                  exec:
                    command:
                      - pgrep
                      - ds4
                  periodSeconds: 30
                  failureThreshold: 5
            servicemonitor:
              enabled: false
            litellm:
              enabled: false
            initContainers:
              - name: setup
                image: python:3.12-slim
                env:
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: models-external-secret
                        key: hf_token
                  - name: HF_HUB_ENABLE_HF_TRANSFER
                    value: "1"
                command:
                  - /bin/bash
                  - -lc
                  - |
                    set -euo pipefail
                    pip install -q --no-cache-dir --root-user-action=ignore huggingface_hub hf_transfer
                    D=/models/cache/deepseek-41-flash
                    mkdir -p "$D"
                    # hf download is natively idempotent: skips complete
                    # files, resumes partial ones (writes .incomplete temp,
                    # renames on completion). hf_transfer parallelizes the single
                    # 340.6 GiB file across connections.
                    echo "[setup] downloading DeepSeek-V4.1-Flash Q2 + Vision (~341 GiB)"
                    hf download antirez/deepseek-v4.1-flash-gguf \
                      --include 'DeepSeek-V4.1-Flash-Q2.gguf' \
                      --include 'DeepSeek-V4.1-Flash-Vision.gguf' \
                      --max-workers 8 \
                      --local-dir "$D"
                    echo "[setup] done"
