              - name: setup
                # python:3.12-slim ships a proper CA store (same reasoning as
                # the gufo entry's setup container). Idempotent: hf download
                # skips complete files and resumes partial ones.
                #
                # --include is explicit (not --exclude): upstream added
                # ngram.hgn (51 GiB) and v2.hgn (67 GiB) on 2026-09-29 and an
                # exclude-only filter pulled both on the next pod restart.
                # --revision pins the snapshot so upstream changes can never
                # trigger a surprise re-download; bump deliberately.
                image: python:3.12-slim
                env:
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: models-external-secret
                        key: hf_token
                  - name: HF_HUB_ENABLE_HF_TRANSFER
                    value: "1"
                command:
                  - /bin/bash
                  - -lc
                  - |
                    set -euo pipefail
                    pip install -q --no-cache-dir --root-user-action=ignore huggingface_hub hf_transfer
                    D=/models/cache/halogen
                    mkdir -p "$D"
                    echo "[setup] downloading halogen v2 ckpt + ngram table + tokenizer (~110 GiB)"
                    hf download peonist-ai/halogen-qwen3.8-flash-next \
                      --revision 5cc17cea1a10b502b4a5db41d8d2b1a0f22dba26 \
                      --include 'qwen38-flash-next-v2.hgn' \
                      --include 'qwen38-flash-next-ngram.hgn' \
                      --include 'qwen38-flash-next-vision.hgn' \
                      --include 'tokenizer/*' \
                      --max-workers 8 \
                      --local-dir "$D"
                    echo "[setup] done"
