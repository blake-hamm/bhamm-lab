          - name: qwen-38-27b
            description: High quality dense MTP VLM model for general chat (Qwen 3.8, vLLM MXFP4 on R9700)
            enabled: true
            hostIPC: true
            pvc:
              storage: "80Gi"
            image:
              repository: harbor.bhamm-lab.com/library/vllm-radiance-mxfp4
              tag: latest
            nodeSelector:
              kubernetes.io/hostname: prod-talos-worker-amd-r9700
            hfToken:
              enabled: true
              secretName: models-external-secret
              secretKey: hf_token
            initContainers:
              - name: setup
                image: harbor.bhamm-lab.com/library/vllm-radiance-mxfp4:latest
                command:
                  - /bin/bash
                  - -lc
                  - |
                    set -euo pipefail
                    SNAP=/models/cache/Qwen3.8-27B-MXFP4-mtpfp8
                    DRAFTER=/models/cache/Qwen3.8-27B-DFlash2-FP8
                    R4D_DIR=/models/cache/radiance-libr4d/b9e42ab-rx6

                    AVAIL_GB=$(df -BG --output=avail /models/cache | tail -1 | tr -dc '0-9')
                    if [ ! -f "$SNAP/config.json" ] && [ "$AVAIL_GB" -lt 40 ]; then
                      echo "[setup] only ${AVAIL_GB}GiB free on the model PVC; the checkpoint"
                      echo "[setup] download + fp8 rewrite want ~40GiB transient. Free space or"
                      echo "[setup] grow the user volume, then restart the pod."
                      exit 1
                    fi

                    if [ ! -f "$SNAP/config.json" ]; then
                      echo "[setup] downloading amd/Qwen3.8-27B-Quark-AWQ-MXFP4 (~19 GiB)"
                      python3 -c 'from huggingface_hub import snapshot_download; snapshot_download("amd/Qwen3.8-27B-Quark-AWQ-MXFP4")'
                      SRC=$(ls -d "$HF_HOME"/hub/models--amd--Qwen3.8-27B-Quark-AWQ-MXFP4/snapshots/*/ | head -1)
                      echo "[setup] requantizing MTP head to fp8 (~15 min): $SRC -> $SNAP"
                      python3 /patches/fp8_mtp.py "$SRC" "$SNAP"
                      [ -f "$SNAP/config.json" ] || { echo "[setup] fp8_mtp.py produced no config.json"; exit 1; }
                      # The HF source snapshot (~19GiB) is only needed during the rewrite.
                      rm -rf "$HF_HOME"/hub/models--amd--Qwen3.8-27B-Quark-AWQ-MXFP4
                      echo "[setup] freed the source snapshot from the HF cache"
                    else
                      echo "[setup] checkpoint exists: $SNAP"
                    fi

                    if [ ! -f "$DRAFTER/config.json" ]; then
                      echo "[setup] downloading tcclaviger/Qwen3.8-27B-DFlash2-FP8 (2 GiB)"
                      python3 -c 'from huggingface_hub import snapshot_download; snapshot_download("tcclaviger/Qwen3.8-27B-DFlash2-FP8", local_dir="/models/cache/Qwen3.8-27B-DFlash2-FP8")'
                    else
                      echo "[setup] drafter exists: $DRAFTER"
                    fi

                    if [ ! -f "$R4D_DIR/r4d.so" ]; then
                      echo "[setup] building libr4d b9e42ab + r4d_radiance_extras.patch"
                      rm -rf /models/cache/radiance-libr4d/.build
                      mkdir -p /models/cache/radiance-libr4d
                      git clone -q https://codeberg.org/StillDeadcode/libr4d.git /models/cache/radiance-libr4d/.build
                      git -C /models/cache/radiance-libr4d/.build checkout -q b9e42ab
                      git -C /models/cache/radiance-libr4d/.build apply /patches/r4d_radiance_extras.patch
                      (cd /models/cache/radiance-libr4d/.build && ./build.sh)
                      mv /models/cache/radiance-libr4d/.build "$R4D_DIR"
                    else
                      echo "[setup] libr4d exists: $R4D_DIR"
                    fi
                env:
                  - name: HF_HOME
                    value: /models/cache/huggingface
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: models-external-secret
                        key: hf_token
                resources:
                  requests:
                    cpu: "2"
                    memory: "8Gi"
                  limits:
                    cpu: "8"
                    memory: "16Gi"
                volumeMounts:
                  - name: model-cache
                    mountPath: /models/cache
            command:
              - /bin/bash
              - -lc
              - |
                set -e
                SP=/opt/vllm/lib/python3.12/site-packages
                cd /patches
                for p in patch_quark_mxfp4 patch_tp3_pad patch_ar_maxbytes patch_topk_triton_rows \
                    patch_dflash_calib patch_dflash_mxfp4_kv patch_rmsquant_fusion patch_verify_head \
                    patch_kv_group_size patch_topk_composite patch_gdn_shared_build patch_dflash_selector_topk \
                    patch_gdn_merge_inproj patch_dynwidth patch_async_dynwidth patch_step_trace \
                    patch_ar_geometry patch_ar_3rank patch_gdn_glue; do
                  python3 "$p.py"
                done
                python3 patch_qwen3_thinkoff.py \
                  || echo "[radiance] WARNING: thinkoff patch did not apply; thinking-off requests will return empty content"
                cp mxfp4-configs/*.json "$SP"/aiter/ops/triton/configs/gemm/
                cp radiance_mxfp4.py radiance_gdn.py radiance_rmsquant.py radiance_drafthead.py \
                   radiance_verifyhead.py radiance_gdnmerge.py radiance_aroverlap.py radiance_topk.py \
                   radiance_arnq.py radiance_tp3pad.py "$SP"/
                hipcc -O3 -w -std=c++17 -fPIC -shared --offload-arch=gfx1201 \
                  $(python3 -m pybind11 --includes) radiance_mxfp4_fp8.hip -o "$SP"/radiance_mxfp4_fp8.so
                cp /models/cache/radiance-libr4d/b9e42ab-rx6/r4d.so "$SP"/r4d.so
                echo "[radiance] libr4d b9e42ab-rx6 -> $SP/r4d.so"
                cd /
                exec /opt/radiance_entrypoint.sh "$@"
              - _
            args:
              - /models/cache/Qwen3.8-27B-MXFP4-mtpfp8
              - --served-model-name
              - qwen-38-27b
              - Qwen3.8
              - Qwen3.8-MXFP4
