              - -fa
              - "on"
              - -c
              - "65536"
              - --parallel
              - "2"
              - --cont-batching
              - --temp
              - "0.7"
              - --min-p
              - "0.00"
              - --top-p
              - "0.8"
              - --top-k
              - "20"
              - --presence-penalty
              - "1.5"
            resources:
              limits:
                amd.com/gpu: 1
                memory: "120Gi"
                cpu: "8"
              requests:
                amd.com/gpu: 1
                cpu: "4"
                memory: "110Gi"
          - name: qwen-36-a3b
            description: High quality MoE model for general chat
            enabled: true
            pvc:
              storage: "40Gi"
            image:
              tag: rocm-10.0_20260925T042242
            args:
              - llama-server
              - -hf
              - unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q8_K_XL
              - --host
              - 0.0.0.0
