                    fi
                    if [ ! -f "$SNAP/config.json" ]; then
                      echo "[setup] downloading SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16 (~20 GiB)"
                      python3 -c 'from huggingface_hub import snapshot_download; snapshot_download("SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16", local_dir="/models/cache/Qwen3.8-27B-GPTQ-INT4")'
                    else
                      echo "[setup] checkpoint exists: $SNAP"
                    fi
                env:
                  - name: HF_HOME
                    value: /models/cache/huggingface
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: models-external-secret
                        key: hf_token
                resources:
                  requests:
                    cpu: "2"
                    memory: "8Gi"
                  limits:
                    cpu: "8"
                    memory: "16Gi"
                volumeMounts:
                  - name: model-cache
                    mountPath: /models/cache
            command:
              - vllm
              - serve
            args:
              - /models/cache/Qwen3.8-27B-GPTQ-INT4
              - --served-model-name
              - qwen-38-27b-b70
              - --host
              - 0.0.0.0
              - --port
              - "8080"
              - --quantization
              - gptq
              - --dtype
              - float16
              # Match the r9700 context length (114688). fp16 KV does NOT fit:
              # vLLM startup check requires 8.63 GiB KV at 114688 but only 6.96
              # GiB is available at gpu-mem-util 0.90 (fp16 ceiling: 88064).
              # fp8 KV halves the requirement to ~4.3 GiB and fits with ~2.6 GiB
              # headroom. This is the validated config: this exact checkpoint was
              # benchmarked on this exact B70 at 131072 context with fp8 KV
              # (56-63 tok/s). fp8 quantizes only the cached K/V tensors —
              # weights stay GPTQ INT4, MTP head stays BF16 (same as r9700).
              - --kv-cache-dtype
              - fp8
              - --gpu-memory-utilization
              - "0.90"
              - --max-model-len
              - "114688"
              - --max-num-seqs
              - "8"
              - --max-num-batched-tokens
              - "8192"
              - --speculative-config
              - '{"method":"mtp","num_speculative_tokens":4}'
              - --enable-prefix-caching
              - --enable-auto-tool-choice
              - --tool-call-parser
              - qwen3_coder
              - --reasoning-parser
              - qwen3
              - --trust-remote-code
            env:
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NO_USAGE_STATS
                value: "1"
              - name: VLLM_WORKER_MULTIPROC_METHOD
                value: spawn
              - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
                value: "1"
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: ZES_ENABLE_SYSMAN
                value: "1"
              - name: ONEAPI_DEVICE_SELECTOR
                value: level_zero:0
              - name: VLLM_CACHE_ROOT
                value: /models/cache/vllm
              - name: TORCHINDUCTOR_CACHE_DIR
                value: /models/cache/inductor
              - name: TRITON_CACHE_DIR
                value: /models/cache/triton
              - name: TRITON_CACHE_AUTOTUNING
                value: "1"
              - name: PYTHONPYCACHEPREFIX
                value: /models/cache/pypycache
            zeroscaling:
              enabled: true
              minReplicas: 1
              cooldownPeriod: 1800
              trigger:
                query: >-
                  sum(vllm:num_requests_running{container="qwen-38-27b-b70"}) or vector(0)
                threshold: "1"
            resources:
              limits:
                gpu.intel.com/xe: 1
                memory: "30Gi"
                cpu: "8"
              requests:
                gpu.intel.com/xe: 1
                cpu: "4"
                memory: "24Gi"
  ignoreDifferences:
    - group: apps
      kind: Deployment
      namespace: models
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
