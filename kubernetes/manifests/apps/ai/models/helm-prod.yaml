apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-models
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "18"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: models
  source:
    repoURL: https://github.com/blake-hamm/kube-ai-stack.git
    targetRevision: fix/model-resources-verbatim
    path: charts/kube-ai-stack
    helm:
      valuesObject:
        global:
          prometheusUrl: "http://monitor-prometheus.monitor.svc.cluster.local:9090"
          mlflow:
            enabled: true
          phoenix:
            enabled: true
          litellm:
            manage_config: true
            config:
              litellm_settings:
                request_timeout: 1800
                drop_params: true
                modify_params: True
                cache: False
                cache_params:
                  type: qdrant-semantic
                  qdrant_semantic_cache_embedding_model: qwen-embed
                  qdrant_collection_name: litellm
                  similarity_threshold: 0.6
                callbacks: ["arize_phoenix"]
                success_callback: ["mlflow"]
                failure_callback: ["mlflow"]
              general_settings:
                enforce_user_param: False
                store_model_in_db: True
                store_prompts_in_spend_logs: True
                health_check_interval: 1800
              router_settings:
                debug_level: "INFO"
                allowed_fails: 999
                timeout: 1800
                num_retries: 0
                routing_strategy: simple-shuffle
                redis_host: os.environ/REDIS_HOST
                redis_port: os.environ/REDIS_PORT
                redis_password: os.environ/REDIS_PASSWORD
              search_tools:
                - search_tool_name: searxng-search
                  litellm_params:
                    search_provider: searxng
                    api_base: http://searxng.searxng.svc.cluster.local:8080
        mlflow:
          image:
            repository: ghcr.io/mlflow/mlflow
            pullPolicy: IfNotPresent
            tag: "v3.10.1-full"
          initImages:
            mlflowDbMigration:
              repository: ghcr.io/mlflow/mlflow
              pullPolicy: IfNotPresent
              tag: "v3.10.1-full"
          backendStore:
            databaseMigration: true
            databaseConnectionCheck: true
            postgres:
              enabled: true
              host: "models-postgresql-rw"
              port: 5432
              database: "mlflow"
            existingDatabaseSecret:
              name: "models-postgresql-app"
              usernameKey: "username"
              passwordKey: "password"
          artifactRoot:
            proxiedArtifactStorage: true
            s3:
              enabled: true
              bucket: mlflow
              existingSecret:
                name: "models-external-secret"
                keyOfAccessKeyId: "s3_access_key"
                keyOfSecretAccessKey: "s3_secret_key"
          extraEnvVars:
            MLFLOW_S3_ENDPOINT_URL: http://external-rgw.ceph.svc.cluster.local:80
            MLFLOW_S3_IGNORE_TLS: "true"
            MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE: "true"
          extraFlags:
            - serveArtifacts
          serviceMonitor:
            enabled: true
            namespace: models
          extraVolumes:
            - name: prometheus-dir
              emptyDir: {}
          extraVolumeMounts:
            - name: prometheus-dir
              mountPath: /mlflow
        phoenix-helm:
          healthChecks:
            startupProbe:
              periodSeconds: 5
              failureThreshold: 60
          ingress:
            enabled: false
          postgresql:
            enabled: false
          persistence:
            enabled: false
          server:
            telemetryEnabled: false
          service:
            type: "ClusterIP"
          auth:
            enableAuth: false
            createSecret: false
            secret: []
          additionalEnv:
            - name: PHOENIX_POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: models-postgresql-app
                  key: host
            - name: PHOENIX_POSTGRES_PORT
              valueFrom:
                secretKeyRef:
                  name: models-postgresql-app
                  key: port
            - name: PHOENIX_POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: models-postgresql-app
                  key: user
            - name: PHOENIX_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: models-postgresql-app
                  key: password
            - name: PHOENIX_POSTGRES_DB
              value: "phoenix"
        models:
          - name: qwen-embed
            description: Qwen3-Embedding-8B on Arc Pro B70 (Intel LLM-Scaler vLLM, XPU) — migrated off the r9700 llama.cpp backend
            enabled: true
            hostIPC: true
            pvc:
              storage: "30Gi"
            image:
              repository: intel/llm-scaler-vllm
              tag: 0.26.0-b2
            nodeSelector:
              kubernetes.io/hostname: prod-talos-worker-intel-b70
            tolerations:
              - key: "intel.com/gpu"
                operator: "Exists"
                effect: "NoSchedule"
            hfToken:
              enabled: true
              secretName: models-external-secret
              secretKey: hf_token
            initContainers:
              - name: setup
                image: intel/llm-scaler-vllm:0.26.0-b2
                command:
                  - /bin/bash
                  - -lc
                  - |
                    set -euo pipefail
                    SNAP=/models/cache/Qwen3-Embedding-8B
                    AVAIL_GB=$(df -BG --output=avail /models/cache | tail -1 | tr -dc '0-9')
                    if [ ! -f "$SNAP/config.json" ] && [ "$AVAIL_GB" -lt 20 ]; then
                      echo "[setup] only ${AVAIL_GB}GiB free on the model PVC; the embedding checkpoint"
                      echo "[setup] download wants ~16GiB. Free space or grow the user volume, then restart."
                      exit 1
                    fi
                    if [ ! -f "$SNAP/config.json" ]; then
                      echo "[setup] downloading Qwen/Qwen3-Embedding-8B (~16 GiB)"
                      python3 -c 'from huggingface_hub import snapshot_download; snapshot_download("Qwen/Qwen3-Embedding-8B", local_dir="/models/cache/Qwen3-Embedding-8B")'
                    else
                      echo "[setup] checkpoint exists: $SNAP"
                    fi
                env:
                  - name: HF_HOME
                    value: /models/cache/huggingface
                  - name: HF_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: models-external-secret
                        key: hf_token
                volumeMounts:
                  - name: model-cache
                    mountPath: /models/cache
            command:
              - vllm
              - serve
            args:
              - /models/cache/Qwen3-Embedding-8B
              - --served-model-name
              - qwen-embed
              - --task
              - embed
              - --host
              - 0.0.0.0
              - --port
              - "8080"
              - --max-model-len
              - "8192"
              - --dtype
              - float16
              - --trust-remote-code
            env:
              - name: VLLM_LOGGING_LEVEL
                value: INFO
              - name: VLLM_NO_USAGE_STATS
                value: "1"
              - name: VLLM_WORKER_MULTIPROC_METHOD
                value: spawn
              - name: ZES_ENABLE_SYSMAN
                value: "1"
              - name: ONEAPI_DEVICE_SELECTOR
                value: level_zero:0
              - name: VLLM_CACHE_ROOT
                value: /models/cache/vllm
              - name: HF_HUB_OFFLINE
                value: "1"
            zeroscaling:
              enabled: true
              minReplicas: 1
              cooldownPeriod: 1800
              trigger:
                query: >-
                  sum(vllm:num_requests_running{container="qwen-embed"}) or vector(0)
                threshold: "1"
            resources:
              limits:
                gpu.intel.com/xe: 1
                memory: "24Gi"
                cpu: "8"
              requests:
                gpu.intel.com/xe: 1
                cpu: "4"
                memory: "20Gi"
          - name: gpt-oss-120b
            description: Great reasoning MoE model for general chat queries
