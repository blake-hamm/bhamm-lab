apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: health-common
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  destination:
    namespace: health
    server: https://kubernetes.default.svc
  source:
    repoURL: https://codeberg.org/blake-hamm/bhamm-lab.git
    targetRevision: main
    path: kubernetes/charts/common
    helm:
      valuesObject:
        name: health
        ingressRoutes:
          - enabled: true
            name: health-ingest
            ingressClass: traefik-external
            routes:
              - match: Host(`health-ingest.bhamm-lab.com`)
                kind: Rule
                services:
                  - name: health-ingest
                    port: 8080
                    scheme: http
        externalSecrets:
          enabled: true
          secrets:
            - secretKey: INGEST_TOKEN
              remoteRef:
                key: /default/health
                property: ingest_token
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
