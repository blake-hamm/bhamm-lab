apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: health-common
  namespace: argocd
  annotations:
    # Before the receiver (22) so the child app renders the ExternalSecret
    # (wave 14) first. NetworkPolicies share this wave.
    argocd.argoproj.io/sync-wave: "21"
spec:
  destination:
    namespace: health
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://codeberg.org/blake-hamm/bhamm-lab.git
    targetRevision: main
    path: kubernetes/charts/common
    helm:
      valuesObject:
        # The chart uses .Values.name as the namespace for every object it
        # renders, so this must be the namespace itself.
        name: health
        externalSecrets:
          enabled: true
          secrets:
            - secretKey: INGEST_TOKEN
              remoteRef:
                key: /default/health
                property: ingest_token
        ingressRoutes:
          - enabled: true
            name: health-receiver
            ingressClass: traefik-external
            routes:
              - kind: Rule
                match: Host(`health-receiver.bhamm-lab.com`)
                middlewares:
                  - name: default-headers
                services:
                  - name: health-receiver
                    scheme: http
                    port: 8080
        tunnelBindings:
          - name: health-receiver-tunnel-binding
            subjects:
              - name: health-receiver
                spec:
                  target: http://health-receiver.health.svc.cluster.local:8080
                  fqdn: health-receiver.bhamm-lab.com
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
