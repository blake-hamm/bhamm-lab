# INGEST_TOKEN for the health receiver, straight from Vault.
#
# Mirrors the shape the common chart renders (kubernetes/charts/common/
# templates/external-secret.yaml): external-secrets.io/v1, ClusterSecretStore
# `vault-backend`, refreshInterval 30m, SkipDryRunOnMissingResource, wave 14.
# This app is plain manifests rather than the common chart, so the object lives
# here instead of being rendered.
#
# Fail-closed by construction: if the Vault path or property is missing, ESO
# does not create/refresh health-receiver-secret, secretKeyRef fails and the
# pod never starts. It never falls back to an empty or baked-in token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: health-receiver
  namespace: health
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "14"
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: health-receiver-secret
    creationPolicy: Owner
  data:
    # SOPS -> Vault sync puts secrets.enc.json vault_secrets.default.health
    # at /default/health (key `ingest_token`).
    - secretKey: INGEST_TOKEN
      remoteRef:
        key: /default/health
        property: ingest_token
