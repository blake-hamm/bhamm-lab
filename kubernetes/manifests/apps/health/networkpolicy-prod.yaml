# Netpol for the health namespace (VictoriaMetrics single, plus the k8up
# backup pods that back up its PVC). Same shape as
# apps/ai/hermes/networkpolicy-prod.yaml.
#
# Cilium runs default enforcement mode: any CNP selecting these endpoints
# flips the namespace to deny-by-default for traffic no rule matches, so the
# egress allow-list below IS the default-deny egress. An empty
# ingress+egress CNP is rejected as invalid by Cilium, hence no separate
# empty default-deny object.
#
# Phase 1 workloads: the vmsingle StatefulSet and the ingest receiver (its own
# narrower policy at the bottom of this file); k8up's job pods land in this
# namespace too and are selected by endpointSelector: {}, so the DNS /
# kube-apiserver / RGW rules below serve both.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: health-ingress
  namespace: health
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  endpointSelector: {}
  ingress:
    # Two admitted sources, both scoped to 8428/TCP:
    #   - namespace monitor: Prometheus scrapes vmsingle (ServiceMonitor -> pod :8428)
    #   - namespace health:  the health-receiver pod writes Influx line protocol to
    #                        :8428 synchronously on every accepted POST
    # The receiver runs in this same namespace, so a namespace selector (not an
    # app selector) is what admits it. endpointSelector: {} means this policy
    # governs every pod in the namespace, so the rule is scoped by destination
    # port rather than by source.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: monitor
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: health
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: health-egress
  namespace: health
  annotations:
    argocd.argoproj.io/sync-wave: "21"
spec:
  endpointSelector: {}
  egress:
    # DNS (kube-dns) — required for everything below
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API — k8up backup jobs patch their CR status / read secrets
    - toEntities:
        - kube-apiserver
    # Ceph RGW S3 (onsite backup target for the k8up restic repository).
    # external-rgw is a selector-less Service with manual Endpoints to the
    # Proxmox hosts; Cilium KPR translates ClusterIP:80 -> backend:7480
    # BEFORE egress enforcement, so match the backend CIDRs + 7480, not the
    # service port. Endpoints per
    # kubernetes/manifests/base/ceph/rgw-endpoints-all.yaml (VLAN 30).
    - toCIDR:
        - 10.0.30.11/32
        - 10.0.30.12/32
        - 10.0.30.13/32
      toPorts:
        - ports:
            - port: "7480"
              protocol: TCP
---
# Ingest receiver (phase 1). Separate object, narrower selector: the existing
# rules above select endpointSelector {} (vmsingle + k8up), so extending them
# would open :8080 on vmsingle as well. Cilium policies are additive, so the
# DNS / apiserver egress already allowed above still applies to this pod and is
# deliberately NOT repeated here.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: health-receiver
  namespace: health
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  endpointSelector:
    matchLabels:
      app: health-receiver
  ingress:
    # HAE POSTs arrive by two paths, both to 8080/TCP:
    #   - cloudflared (namespace cloudflare-operator-system) dials the Service
    #     ClusterIP directly: the TunnelBinding target is
    #     http://health-receiver.health.svc.cluster.local:8080, so the public
    #     path is pod-to-pod and never touches Traefik.
    #   - Traefik serves the IngressRoute for the same host in-cluster.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflare-operator-system
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Synchronous Influx write to the in-cluster vmsingle (Service
    # health-vm-victoria-metrics-single-server:8428).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: health
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
