kind: Deployment
apiVersion: apps/v1
metadata:
  name: huntarr
  namespace: servarr
  labels:
    app: huntarr
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: huntarr
  template:
    metadata:
      labels:
        app: huntarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: huntarr
          # Huntarr.io ended Feb 2026: ghcr.io/plexguide/huntarr returns 403 (verified
          # 2026-10-26). No verified drop-in successor found (huntarr/huntarr on hub is
          # not pullable anonymously; huntarr/plexguide is the PlexGuide platform, not
          # Huntarr — OCI labels prove it). Tracked in .ci/digest-exceptions.txt until a
          # successor is chosen (candidate: ghcr.io/elfhosted/newtarr, fork of Huntarr).
          image: ghcr.io/plexguide/huntarr:latest
          ports:
            - containerPort: 9705
          volumeMounts:
            - name: huntarr-config
              mountPath: /config
          env:
            - name: TZ
              value: "America/Denver"
            - name: HUNTARR_PORT
              value: "9705"
      volumes:
        - name: huntarr-config
          persistentVolumeClaim:
            claimName: huntarr-config
