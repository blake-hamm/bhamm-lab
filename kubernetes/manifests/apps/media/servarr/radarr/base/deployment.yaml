kind: Deployment
apiVersion: apps/v1
metadata:
  name: radarr
  namespace: servarr
  labels:
    app: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:6.2.1
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              # CPU is idle between imports, so this is burst headroom for the
              # same cross-volume copy + MediaInfo work sonarr does; 500m
              # queues that behind throttling for the whole import.
              cpu: "2"
              # 512Mi limit OOMKilled during imports (same between-sample
              # spike pattern as sonarr in #363) and the idle plateau is now
              # ~540Mi, leaving one import burst of headroom at 1Gi.
              memory: "2Gi"
          ports:
            - containerPort: 7878
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: media
              mountPath: /media
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Denver"
            - name: RADARR__APP__INSTANCENAME
              value: radarr
            - name: RADARR__APP__THEME
              value: dark
            - name: RADARR__AUTH__METHOD
              value: External
            - name: RADARR__AUTH__REQUIRED
              value: DisabledForLocalAddresses
            - name: RADARR__LOG__DBENABLED
              value: "False"
            - name: RADARR__LOG__LEVEL
              value: info
      volumes:
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
        - name: media
          persistentVolumeClaim:
            claimName: media
