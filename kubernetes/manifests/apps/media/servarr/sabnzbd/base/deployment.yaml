apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: servarr
  labels:
    app: sabnzbd
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: sabnzbd
          image: lscr.io/linuxserver/sabnzbd:latest
          resources:
            requests:
              # 50m gave this pod ~5% of a core's CFS share, so it was starved
              # whenever the node was busy. 250m tracks the bursty-but-idle
              # profile better without reserving a full core.
              cpu: "250m"
              memory: "256Mi"
            limits:
              # Post-processing (par2 verify/repair + unpack) is CPU bound.
              # At 1 CPU the cgroup sat at its quota ~79% of CFS periods during
              # a repair, starving the NNTP decoder and the web UI. Paired with
              # SABnzbd's "Extra PAR2 Parameters = -t2" (set in the GUI, lives
              # on the sabnzbd-config PVC) so par2 cannot spawn one thread per
              # node core inside this quota.
              cpu: "2"
              # 1Gi limit still OOMKilled 3x in 7d (spikes between cadvisor
              # samples; #359). Requests stay low — limits are burst headroom.
              memory: "2Gi"
          ports:
            - containerPort: 8080
              name: web-ui
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Denver"
          volumeMounts:
            - name: sabnzbd-config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
      volumes:
        - name: sabnzbd-config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
