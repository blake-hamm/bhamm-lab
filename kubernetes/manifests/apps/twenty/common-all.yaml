apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: twenty-common
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  destination:
    namespace: twenty
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://codeberg.org/blake-hamm/bhamm-lab.git
    targetRevision: main
    path: kubernetes/charts/common
    helm:
      valuesObject:
        name: twenty
        postgresql:
          enabled: true
          backup:
            enabled: true
          restore:
            enabled: true
        dragonfly:
          enabled: true
          args:
            - --default_lua_flags=allow-undeclared-keys
          # Fleet sweep #361: p95 mem <=25MB; chart default 500m/500Mi was ~20x over.
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
        pvc:
          - name: twenty-local-data
            storageSize: 10Gi
        k8up:
          backup:
            enabled: true
          restore:
            enabled: true
        externalSecrets:
          enabled: true
          secrets:
            - secretKey: APP_SECRET
              remoteRef:
                key: /default/twenty
                property: APP_SECRET
            - secretKey: ENCRYPTION_KEY
              remoteRef:
                key: /default/twenty
                property: ENCRYPTION_KEY
        ingressRoutes:
          - name: twenty
            ingressClass: traefik-external
            websocket: true
            routes:
              - match: Host(`crm.bhamm-lab.com`)
                kind: Rule
                middlewares:
                  - name: default-headers
                services:
                  - name: twenty-server
                    scheme: http
                    port: 3000
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
