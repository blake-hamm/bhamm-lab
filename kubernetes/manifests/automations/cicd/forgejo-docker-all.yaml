apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: forgejo-docker-changes
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  template:
    serviceAccountName: argo-workflow
  dependencies:
    - name: forgejo-push-event
      eventSourceName: forgejo
      eventName: push
      filters:
        script: |-
          -- A push that CREATES a branch carries no commit data (empty commit
          -- list, all-zero "before"). Accept it so the changed paths can be
          -- resolved from the compare API below. Zero-commit tag creations stay
          -- out: this guard also requires an all-zero "before" and a
          -- refs/heads/ ref. A tag push that carries commits is left to the
          -- commit loop further down.
          if (event.body.commits == nil or #event.body.commits == 0)
              and string.match(event.body.before or "", "^0+$")
              and string.sub(event.body.ref or "", 1, 11) == "refs/heads/" then
              return true
          end

          -- Check all commits for docker/ path changes
          for _, commit in ipairs(event.body.commits or {}) do
              -- Check added files
              for _, path in ipairs(commit.added) do
                  if string.sub(path, 1, 7) == "docker/" then
                      return true
                  end
              end

              -- Check modified files
              for _, path in ipairs(commit.modified) do
                  if string.sub(path, 1, 7) == "docker/" then
                      return true
                  end
              end

              -- Check removed files
              for _, path in ipairs(commit.removed) do
                  if string.sub(path, 1, 7) == "docker/" then
                      return true
                  end
              end
          end
          return false
  triggers:
    - template:
        name: docker-change-trigger
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: forgejo-docker-changes-
              spec:
                serviceAccountName: argo-workflow
                entrypoint: main
                onExit: exit-handler
                arguments:
                  parameters:
                    - name: commits
                    - name: repoUrl
                    - name: branch
                    - name: git-sha
                    - name: before
                    - name: after
                templates:
                  - name: main
                    inputs:
                      parameters:
                        - name: commits
                        - name: repoUrl
                        - name: branch
                        - name: git-sha
                        - name: before
                        - name: after
                    dag:
                      tasks:
                        - name: forgejo-status
                          templateRef:
                            name: forgejo-status
                            template: forgejo-status
                          arguments:
                            parameters:
                              - name: git-sha
                                value: "{{inputs.parameters.git-sha}}"
                              - name: state
                                value: "pending"
                        - name: extract-dockerfiles
                          template: extract-dockerfiles
                          arguments:
                            parameters:
                              - name: commits
                                value: "{{inputs.parameters.commits}}"
                              - name: after
                                value: "{{inputs.parameters.after}}"
                        - name: clone-repo
                          templateRef:
                            name: clone-repo
                            template: clone-repo
                          arguments:
                            parameters:
                              - name: url
                                value: "{{inputs.parameters.repoUrl}}"
                              - name: branch
                                value: "{{inputs.parameters.branch}}"
                        - name: prepare-config
                          template: prepare-docker-config
                        - name: build-and-push
                          template: build-and-push-kaniko
                          depends: "extract-dockerfiles && clone-repo && prepare-config"
                          arguments:
                            parameters:
                              - name: dockerfile
                                value: "{{item}}"
                            artifacts:
                              - name: repository
                                from: "{{tasks.clone-repo.outputs.artifacts.repo}}"
                              - name: docker-config
                                from: "{{tasks.prepare-config.outputs.artifacts.docker-creds}}"
                          withParam: "{{tasks.extract-dockerfiles.outputs.result}}"
                  - name: extract-dockerfiles
                    inputs:
                      parameters:
                        - name: commits
                        - name: after
                      artifacts:
                        - name: input-json
                          path: /tmp/input.json
                          raw:
                            data: "{{inputs.parameters.commits}}"
                    script:
                      image: python:3.14-alpine
                      command: [python]
                      env:
                        - name: AFTER_SHA
                          value: "{{inputs.parameters.after}}"
                      resources:
                        requests:
                          cpu: 100m
                          memory: 128Mi
                        limits:
                          cpu: 500m
                          memory: 256Mi
                      source: |
                        import json
                        import os
                        import sys
                        import urllib.request

                        COMPARE_URL = 'https://codeberg.org/api/v1/repos/blake-hamm/bhamm-lab/compare/main...'

                        with open('/tmp/input.json', 'r') as f:
                            commits = json.load(f)

                        def dockerfiles(paths):
                            found = []
                            for path in paths:
                                parts = path.split('/')
                                if len(parts) >= 2 and parts[0] == 'docker':
                                    dockerfile_path = os.path.join('docker', parts[1], 'Dockerfile')
                                    if dockerfile_path not in found:
                                        found.append(dockerfile_path)
                            return found

                        if commits:
                            docker_files = []
                            for commit in commits:
                                for path in dockerfiles(commit.get('added', []) + commit.get('modified', [])):
                                    if path not in docker_files:
                                        docker_files.append(path)
                        else:
                            # A push that creates a branch carries no commit data; resolve the changed
                            # paths through the Codeberg compare API (the mirror's own endpoint 404s).
                            url = COMPARE_URL + os.environ['AFTER_SHA']
                            try:
                                with urllib.request.urlopen(url, timeout=30) as resp:
                                    changed = json.load(resp)
                            except Exception as exc:
                                sys.exit('ERROR: compare request failed for %s: %s' % (url, exc))
                            if not isinstance(changed, dict) or 'files' not in changed:
                                sys.exit('ERROR: compare returned no file list for %s' % url)
                            # Only added/modified entries are build targets: a removed path has no
                            # Dockerfile left to build.
                            files = changed['files'] or []
                            docker_files = dockerfiles([f['filename'] for f in files
                                                        if f.get('status') in ('added', 'modified')])

                        print(json.dumps(docker_files))
                  - name: prepare-docker-config
                    outputs:
                      artifacts:
                        - name: docker-creds
                          path: /kaniko/.docker
                          archive:
                            none: {}
                    script:
                      image: alpine:3.24
                      command: [sh]
                      resources:
                        requests:
                          cpu: 100m
                          memory: 128Mi
                        limits:
                          cpu: 500m
                          memory: 256Mi
                      env:
                        - name: REGISTRY
                          value: "harbor.bhamm-lab.com"
                        - name: ROBOT_USERNAME
                          valueFrom:
                            secretKeyRef:
                              name: argo-external-secret
                              key: robot-username
                        - name: ROBOT_TOKEN
                          valueFrom:
                            secretKeyRef:
                              name: argo-external-secret
                              key: robot-token
                      source: |
                        #!/bin/sh
                        mkdir -p /kaniko/.docker
                        echo '{
                          "auths": {
                            "'"${REGISTRY}"'": {
                              "auth": "'"$(echo -n "${ROBOT_USERNAME}:${ROBOT_TOKEN}" | base64)"'"
                            }
                          }
                        }' > /kaniko/.docker/config.json
                  - name: build-and-push-kaniko
                    inputs:
                      parameters:
                        - name: dockerfile
                      artifacts:
                        - name: repository
                          path: /workspace
                        - name: docker-config
                          path: /kaniko/.docker
                    container:
                      image: gcr.io/kaniko-project/executor:v1.24.0-debug
                      # Kaniko builds were BestEffort (no requests at all) and
                      # competed unbounded with app workloads on the general
                      # workers (#359). Requests schedule the build; limits
                      # allow a real compile burst.
                      resources:
                        requests:
                          cpu: 500m
                          memory: 1Gi
                        limits:
                          cpu: "4"
                          memory: 4Gi
                      command: ["/busybox/sh", "-c"]
                      args:
                        - |
                          # Show debug info
                          echo "Workspace contents:"
                          ls -laR /workspace

                          # Build using parameter from stdout
                          full_path="/workspace/{{inputs.parameters.dockerfile}}"
                          context_dir=$(dirname "$full_path")
                          image_name=$(basename "$context_dir")

                          /kaniko/executor \
                            --context "dir://$context_dir" \
                            --dockerfile "$full_path" \
                            --destination "harbor.bhamm-lab.com/library/$image_name:latest" \
                            --skip-tls-verify \
                            --verbosity=debug
                  - name: exit-handler
                    steps:
                      - - name: final-status
                          templateRef:
                            name: forgejo-status
                            template: forgejo-status
                          arguments:
                            parameters:
                              - name: git-sha
                                value: "{{workflow.parameters.git-sha}}"
                              - name: state
                                value: "{{=workflow.status == 'Succeeded' ? 'success' : 'failure'}}"
          parameters:
            - src:
                dependencyName: forgejo-push-event
                dataKey: body.commits
              dest: spec.arguments.parameters.0.value
              transformation:
                template: "{{ .Input | toJson }}"
            - src:
                dependencyName: forgejo-push-event
                dataKey: body.repository.clone_url
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: forgejo-push-event
                dataKey: body.ref
                transformation:
                  template: '{{ .Input | replace "refs/heads/" "" }}'
              dest: spec.arguments.parameters.2.value
            # head_commit is null on a push that creates a ref (the mirror sends no
            # commit data), so the status SHA comes from the pushed tip instead.
            - src:
                dependencyName: forgejo-push-event
                dataKey: body.after
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: forgejo-push-event
                dataKey: body.before
              dest: spec.arguments.parameters.4.value
            - src:
                dependencyName: forgejo-push-event
                dataKey: body.after
              dest: spec.arguments.parameters.5.value
