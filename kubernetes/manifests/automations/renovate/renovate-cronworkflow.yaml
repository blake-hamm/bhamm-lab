apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: renovate
  namespace: argo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  schedules:
    - "0 1 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  workflowSpec:
    # A starved (Pending) renovate pod made this Forbid-concurrency cron skip
    # every later run for 81h+ (#359). Cap the workflow lifetime: a run that
    # can't finish (or even schedule) within 2h is dead, and the next nightly
    # proceeds instead of being skipped forever. (First night: the 1h cap
    # killed a legitimately-long nightly run at ~60min — 2h bounds the
    # runaway case without amputating real work.)
    activeDeadlineSeconds: 7200
    # Preempt queue position over default-priority app pods when CPU requests
    # are exhausted (PriorityClass defined in automations/priority-classes-all.yaml).
    # Workflow-spec field is podPriorityClassName; plain priorityClassName is the
    # template-level name and gets pruned by the CRD here ("unknown field").
    podPriorityClassName: automation-high
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    serviceAccountName: argo-workflow
    entrypoint: renovate
    templates:
      - name: renovate
        container:
          image: renovate/renovate:43
          env:
            - name: RENOVATE_CONFIG_FILE
              value: /opt/renovate/config.js
            - name: RENOVATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argo-external-secret
                  key: renovate-token
            - name: GITHUB_COM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: argo-external-secret
                  key: github-com-token
            - name: LOG_LEVEL
              value: info
          volumeMounts:
            - name: renovate-config
              mountPath: /opt/renovate
            - name: renovate-cache
              mountPath: /tmp/renovate/cache
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 1000m
    volumes:
      - name: renovate-config
        configMap:
          name: renovate-config
      - name: renovate-cache
        persistentVolumeClaim:
          claimName: renovate-cache
