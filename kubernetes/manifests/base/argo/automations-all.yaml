apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: automations
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://codeberg.org/blake-hamm/bhamm-lab.git
    # TEMP test flip for #405: deploy this branch's renovate config.js before merge; Blake re-pins to main in the Argo UI after the squash-merge (no revert commit).
    targetRevision: fix/renovate-runtime-reliability
    path: kubernetes/manifests/automations
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
    automated:
      prune: true
      selfHeal: true
