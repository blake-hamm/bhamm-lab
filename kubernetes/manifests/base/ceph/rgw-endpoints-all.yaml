apiVersion: v1
kind: Service
metadata:
  name: external-rgw
  namespace: ceph
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  ports:
    - name: s3
      port: 80
      targetPort: 7480
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: external-rgw
  namespace: ceph
  annotations:
    argocd.argoproj.io/sync-wave: "7"
subsets:
  - addresses:
      # VLAN 30 addresses, not the VLAN 20 ones: pods egress on a jumbo
      # segment and inter-VLAN routing on the Omada switch is 1500 without
      # ICMP fragmentation-needed, so a VLAN 20 target silently black-holes
      # large writes and TLS 1.3 handshakes. See
      # docker/docs-site/docs/architecture/network.md.
      - ip: 10.0.30.11
      - ip: 10.0.30.12
      - ip: 10.0.30.13
    ports:
      - name: s3
        port: 7480
        protocol: TCP
