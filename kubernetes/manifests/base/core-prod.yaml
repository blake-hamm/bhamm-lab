apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-core
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: default
  source:
    repoURL: https://codeberg.org/blake-hamm/bhamm-lab.git
    targetRevision: fix/gufo-cache-staging-sessions
    path: kubernetes/manifests/core
    directory:
      recurse: true
      include: "{**all.yaml,**prod.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
    automated:
      prune: true
      selfHeal: true
