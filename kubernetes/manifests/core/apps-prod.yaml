apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-apps
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: default
  source:
    repoURL: https://codeberg.org/blake-hamm/bhamm-lab.git
    # dangling pin to a deleted branch; testing from this branch, re-pin to main before merge
    targetRevision: feature/health-receiver
    path: kubernetes/manifests/apps
    directory:
      recurse: true
      include: "{**all.yaml,**prod.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argo
  ignoreDifferences:
    - group: apps
      kind: Deployment
      namespace: models
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
