apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: git-actions-common
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "19"
spec:
  destination:
    namespace: git-actions
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://codeberg.org/blake-hamm/bhamm-lab.git
    targetRevision: main
    path: kubernetes/charts/common
    helm:
      valuesObject:
        name: git-actions
        externalSecrets:
          enabled: true
          secrets:
            - secretKey: CONFIG_INSTANCE
              remoteRef:
                key: /core/forgejo-runner
                property: instance
            - secretKey: CONFIG_NAME
              remoteRef:
                key: /core/forgejo-runner
                property: name
            - secretKey: CONFIG_TOKEN
              remoteRef:
                key: /core/forgejo-runner
                property: REGISTRATION_TOKEN
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
